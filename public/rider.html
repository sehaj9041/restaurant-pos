<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rider Orders</title>
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>document.write('<link rel="manifest" href="/rider-manifest.json?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '') + '">');</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-orange-500 text-white px-4 py-3 sticky top-0 z-10 shadow">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-[11px] opacity-90 font-bold uppercase">Delivery Rider</div>
        <div id="riderName" class="font-black text-lg leading-tight">...</div>
      </div>
      <div class="flex gap-1.5">
        <button onclick="installApp()" id="btnInstall" class="hidden bg-white text-orange-600 px-3 py-1.5 rounded-lg text-xs font-black">📲 Install App</button>
        <button onclick="enableAlerts()" id="btnAlerts" class="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-black">🔔 Alerts</button>
      </div>
    </div>
  </header>
  <div class="flex bg-white border-b sticky top-[60px] z-10">
    <button id="tabActive" onclick="setTab(false)" class="flex-1 py-2.5 text-sm font-black"></button>
    <button id="tabHistory" onclick="setTab(true)" class="flex-1 py-2.5 text-sm font-black">History</button>
  </div>
  <main id="list" class="p-3 space-y-3 pb-10"></main>

  <div id="payModal" class="hidden fixed inset-0 bg-black/60 z-20 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <div class="font-black text-gray-900">Payment collect karein <span id="payOrd" class="text-orange-600"></span></div>
        <button onclick="closePay()" class="text-gray-400 text-xl font-black">✕</button>
      </div>
      <div class="bg-rose-50 rounded-2xl p-3 text-center">
        <div class="text-xs font-bold text-rose-600">Customer se lene hain</div>
        <div id="payDue" class="text-4xl font-black text-rose-700"></div>
      </div>
      <div class="grid grid-cols-3 gap-2" id="payModes"></div>
      <div id="cashBox" class="space-y-2">
        <label class="text-xs font-bold text-gray-500">Customer ne diye (₹)</label>
        <input id="payReceived" type="number" inputmode="decimal" oninput="updateChange()" class="w-full border-2 border-gray-300 rounded-xl px-3 py-3 text-xl font-black">
        <div id="payChips" class="flex flex-wrap gap-2"></div>
        <div id="payChange" class="text-center rounded-2xl p-3 font-black text-lg bg-gray-100 text-gray-500">Change: ₹0</div>
      </div>
      <button id="payConfirm" onclick="confirmPay()" class="w-full bg-orange-500 disabled:bg-gray-300 text-white py-3.5 rounded-2xl font-black">✔ Payment mili • Delivered</button>
    </div>
  </div>

  <script>
    var token = new URLSearchParams(location.search).get('t') || '';
    var knownIds = null, audioCtx = null, showHistory = false;

    // ---- Install as app (PWA) ----
    var installEvt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function() {});
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault(); installEvt = e;
      document.getElementById('btnInstall').classList.remove('hidden');
    });
    window.addEventListener('appinstalled', function() { installEvt = null; document.getElementById('btnInstall').classList.add('hidden'); });
    var inAppBrowser = /WhatsApp|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
    // Always offer the button unless already running as an installed app (not every browser fires beforeinstallprompt)
    if (!isStandalone) document.addEventListener('DOMContentLoaded', function() { document.getElementById('btnInstall').classList.remove('hidden'); });

    function installApp() {
      if (installEvt) {
        installEvt.prompt();
        installEvt.userChoice.then(function() { installEvt = null; document.getElementById('btnInstall').classList.add('hidden'); });
      } else if (inAppBrowser) {
        alert('Ye link WhatsApp ke andar khula hai. Upar ke menu (⋮) se "Open in Chrome" chunein, phir wahan se Install App dabayein.');
      } else if (isIOS) {
        alert('iPhone par install karne ke liye: Safari mein Share button dabayein, phir "Add to Home Screen" chunein.');
      } else {
        var sw = navigator.serviceWorker && navigator.serviceWorker.controller ? 'ready' : 'abhi load ho raha hai';
        alert('Chrome menu (⋮) kholkar "Install app" ya "Add to Home screen" chunein.\n\nAgar option na dikhe: page ko ek baar refresh karke 10 second ruk kar dobara ye button dabayein.\n\n(Check: secure=' + window.isSecureContext + ', service worker=' + sw + ')');
      }
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    function beep() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.25, 0.5].forEach(function(t) {
          var o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
          g.gain.setValueAtTime(0.3, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
          o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
        });
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      } catch (e) {}
    }

    function enableAlerts() {
      beep(); // a tap is needed before the browser allows sound
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
      document.getElementById('btnAlerts').innerText = '🔔 On';
    }

    function mapsUrl(o) {
      if (o.delivery_lat && o.delivery_lng) return 'https://www.google.com/maps/dir/?api=1&destination=' + o.delivery_lat + ',' + o.delivery_lng;
      return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(o.delivery_address || '');
    }

    function fmtTime(t) {
      var d = new Date(t);
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function historyCard(o) {
      return '<div class="bg-white rounded-2xl shadow-sm p-3.5 space-y-1">' +
        '<div class="flex justify-between items-center"><div class="text-xl font-black text-gray-900">Token ' + esc(o.token_no || '-') + ' <span class="text-[11px] font-bold text-gray-400">ORD-' + o.id + '</span></div>' +
        '<span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Delivered ✓</span></div>' +
        '<div class="text-xs text-gray-500">' + fmtTime(o.delivered_at) + ' • ' + esc(o.customer_name || 'Guest') + '</div>' +
        '<div class="text-xs text-gray-600 line-clamp-1">📍 ' + (esc(o.delivery_address) || '-') + '</div>' +
        '<div class="text-xs font-bold text-gray-700">₹' + o.total + (o.rider_cash_received ? ' • Cash mile ₹' + o.rider_cash_received + (Number(o.rider_cash_change) > 0 ? ', change ₹' + o.rider_cash_change : '') : '') + '</div></div>';
    }

    function setTab(h) { showHistory = h; document.getElementById('list').innerHTML = ''; load(); }

    function card(o) {
      var done = !!o.delivered_at;
      var items = (o.items || []).map(function(i) { return esc(i.qty + ' x ' + i.name) + (i.user_note ? ' <i class="text-yellow-700">(' + esc(i.user_note) + ')</i>' : ''); }).join('<br>');
      var phone = String(o.customer_phone || '').replace(/[^0-9+]/g, '');
      return '<div class="bg-white rounded-2xl shadow p-4 space-y-3 ' + (done ? 'opacity-60' : 'border-2 border-orange-300') + '">' +
        '<div class="flex justify-between items-start"><div><div class="text-2xl font-black text-gray-900 leading-none">Token ' + esc(o.token_no || '-') + '</div><div class="text-[11px] font-bold text-gray-400 mt-1">ORD-' + o.id + '</div></div>' +
        (done ? '<span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Delivered ✓' + (o.rider_cash_received ? ' • ₹' + o.rider_cash_received + ' mile' : '') + '</span>' :
          (o.to_collect > 0 ? '<span class="text-sm font-black bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full">Collect ₹' + o.to_collect + '</span>' : '<span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Paid ✓</span>')) + '</div>' +
        '<div class="text-sm text-gray-800"><div class="font-bold">👤 ' + esc(o.customer_name || 'Guest') + '</div>' +
        '<div class="text-gray-600 mt-0.5">📍 ' + (esc(o.delivery_address) || '<i>Address nahi hai</i>') + '</div></div>' +
        '<div class="text-xs text-gray-600 bg-gray-50 rounded-lg p-2">' + items + '</div>' +
        (done ? '' : '<div class="grid grid-cols-2 gap-2">' +
          ((o.delivery_address || o.delivery_lat) ? '<a href="' + mapsUrl(o) + '" target="_blank" class="bg-sky-500 text-white text-center py-3 rounded-xl font-black text-sm">🧭 Navigate</a>' : '<span class="bg-gray-200 text-gray-400 text-center py-3 rounded-xl font-black text-sm">🧭 No location</span>') +
          (phone ? '<a href="tel:' + phone + '" class="bg-emerald-500 text-white text-center py-3 rounded-xl font-black text-sm">📞 Call</a>' : '<span class="bg-gray-200 text-gray-400 text-center py-3 rounded-xl font-black text-sm">📞 No phone</span>') +
          '<button onclick="markDelivered(' + o.id + ')" class="col-span-2 bg-orange-500 text-white py-3 rounded-xl font-black text-sm">✔ Delivered</button></div>') +
        '</div>';
    }

    function load() {
      fetch('/api/rider/' + encodeURIComponent(token) + '/orders' + (showHistory ? '?history=1' : ''))
        .then(function(r) {
          return r.text().then(function(t) {
            var d; try { d = JSON.parse(t); } catch (e) { throw new Error('Is address (' + location.host + ') par POS server nahi mila. Manager se sahi rider link maangein.'); }
            if (!r.ok) throw new Error(d.error || 'Error');
            return d;
          });
        })
        .then(function(d) {
          document.getElementById('riderName').innerText = d.rider.name;
          var act = 'flex-1 py-2.5 text-sm font-black border-b-2 border-orange-500 text-orange-600', off = 'flex-1 py-2.5 text-sm font-black border-b-2 border-transparent text-gray-400';
          document.getElementById('tabActive').className = showHistory ? off : act;
          document.getElementById('tabHistory').className = showHistory ? act : off;
          if (showHistory) {
            document.getElementById('list').innerHTML = d.orders.length ? d.orders.map(historyCard).join('') : '<p class="text-center text-gray-400 italic py-16">Pichle 7 din mein koi delivery nahi</p>';
            return;
          }
          document.getElementById('tabActive').innerText = 'Active (' + d.orders.length + ')';
          var fresh = d.orders.map(function(o) { return o.id; });
          if (knownIds) {
            var added = fresh.filter(function(id) { return knownIds.indexOf(id) < 0; });
            if (added.length) {
              beep();
              if ('Notification' in window && Notification.permission === 'granted') new Notification('Naya delivery order', { body: 'ORD-' + added[0] + ' assign hua hai' });
            }
          }
          orders = d.orders;
          knownIds = fresh;
          document.getElementById('list').innerHTML = d.orders.length ? d.orders.map(card).join('') : '<p class="text-center text-gray-400 italic py-16">Abhi koi order assign nahi hai</p>';
        })
        .catch(function(err) {
          document.getElementById('list').innerHTML = '<p class="text-center text-red-600 font-bold py-16">' + esc(err.message) + '</p>';
        });
    }

    var orders = [], payOrder = null, payMode = 'CASH';

    function markDelivered(id) {
      var o = orders.filter(function(x) { return x.id === id; })[0];
      if (o && o.to_collect > 0) return openPay(o);
      if (!confirm('Order deliver ho gaya?')) return;
      sendDelivered(id, {});
    }

    function sendDelivered(id, body) {
      fetch('/api/rider/' + encodeURIComponent(token) + '/orders/' + id + '/delivered', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(function(r) { return r.json().then(function(d) { if (!r.ok) throw new Error(d.error || 'Error'); return d; }); })
        .then(function() { closePay(); load(); })
        .catch(function(err) { alert(err.message); });
    }

    function openPay(o) {
      payOrder = o; payMode = 'CASH';
      document.getElementById('payOrd').innerText = 'Token ' + (o.token_no || o.id);
      document.getElementById('payDue').innerText = '₹' + o.to_collect;
      document.getElementById('payReceived').value = '';
      var amounts = [o.to_collect].concat([50, 100, 200, 500, 2000].filter(function(a) { return a > o.to_collect; }).slice(0, 3));
      document.getElementById('payChips').innerHTML = amounts.map(function(a, i) {
        return '<button onclick="setReceived(' + a + ')" class="px-3 py-1.5 rounded-full border-2 border-orange-300 text-orange-700 font-black text-sm">' + (i === 0 ? 'Exact ₹' : '₹') + a + '</button>';
      }).join('');
      renderModes();
      document.getElementById('payModal').classList.remove('hidden');
    }

    function renderModes() {
      document.getElementById('payModes').innerHTML = ['CASH', 'UPI', 'CARD'].map(function(m) {
        return '<button onclick="setMode(\'' + m + '\')" class="py-2.5 rounded-xl font-black text-sm border-2 ' + (m === payMode ? 'bg-orange-500 text-white border-orange-600' : 'bg-white text-gray-700 border-gray-300') + '">' + m + '</button>';
      }).join('');
      document.getElementById('cashBox').classList.toggle('hidden', payMode !== 'CASH');
      updateChange();
    }

    function setMode(m) { payMode = m; renderModes(); }
    function setReceived(a) { document.getElementById('payReceived').value = a; updateChange(); }

    function updateChange() {
      if (!payOrder) return;
      var btn = document.getElementById('payConfirm'), box = document.getElementById('payChange');
      if (payMode !== 'CASH') { btn.disabled = false; return; }
      var rec = parseFloat(document.getElementById('payReceived').value);
      var ok = isFinite(rec) && rec >= payOrder.to_collect;
      btn.disabled = !ok;
      if (!isFinite(rec) || rec <= 0) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-gray-100 text-gray-500'; box.innerText = 'Change: ₹0'; }
      else if (!ok) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-rose-100 text-rose-700'; box.innerText = '₹' + (Math.round((payOrder.to_collect - rec) * 100) / 100) + ' kam hain'; }
      else { box.className = 'text-center rounded-2xl p-3 font-black text-2xl bg-emerald-100 text-emerald-800'; box.innerText = 'Wapas dein: ₹' + (Math.round((rec - payOrder.to_collect) * 100) / 100); }
    }

    function confirmPay() {
      if (!payOrder) return;
      sendDelivered(payOrder.id, { mode: payMode, received: parseFloat(document.getElementById('payReceived').value) });
    }

    function closePay() { payOrder = null; document.getElementById('payModal').classList.add('hidden'); }

    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
