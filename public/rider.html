<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rider Orders</title>
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>document.write('<link rel="manifest" href="/rider-manifest.json?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '') + '">');</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-orange-500 text-white px-4 py-3 sticky top-0 z-10 shadow">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-[11px] opacity-90 font-bold uppercase">Delivery Rider</div>
        <div id="riderName" class="font-black text-lg leading-tight">...</div>
      </div>
      <div class="flex gap-1.5">
        <button onclick="installApp()" id="btnInstall" class="hidden bg-white text-orange-600 px-3 py-1.5 rounded-lg text-xs font-black">📲 Install App</button>
        <button onclick="enableAlerts()" id="btnAlerts" class="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-black">🔔 Alerts</button>
      </div>
    </div>
  </header>
  <div class="flex bg-white border-b sticky top-[60px] z-10">
    <button id="tabActive" onclick="setTab(false)" class="flex-1 py-2.5 text-sm font-black"></button>
    <button id="tabHistory" onclick="setTab(true)" class="flex-1 py-2.5 text-sm font-black">History</button>
  </div>
  <main id="list" class="p-3 space-y-3 pb-10"></main>

  <!-- UPI QR: scan, pay, and the screen moves on by itself when Paytm confirms -->
  <div id="upiCollectModal" class="hidden fixed inset-0 bg-black/60 z-30 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-xs p-4 text-center space-y-2">
      <div class="font-black text-gray-900">📲 Scan &amp; Pay (UPI)</div>
      <div id="ucAmount" class="text-3xl font-black text-emerald-600"></div>
      <div id="ucLabel" class="text-[11px] font-bold text-gray-500"></div>
      <img id="ucQr" alt="UPI QR" class="mx-auto w-56 h-56 border rounded-xl">
      <div id="ucStatus" class="text-xs font-bold text-gray-600">Payment ka intezaar...</div>
      <div class="flex gap-2 pt-1">
        <button onclick="ucCancel()" class="flex-1 border border-gray-300 text-gray-700 font-bold py-2 rounded-xl text-xs">Cancel</button>
        <button onclick="ucManual()" class="flex-1 bg-emerald-600 text-white font-black py-2 rounded-xl text-xs">Payment aa gayi</button>
      </div>
    </div>
  </div>
  <div id="payModal" class="hidden fixed inset-0 bg-black/60 z-20 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <div class="font-black text-gray-900">Payment collect karein <span id="payOrd" class="text-orange-600"></span></div>
        <button onclick="closePay()" class="text-gray-400 text-xl font-black">✕</button>
      </div>
      <div class="bg-rose-50 rounded-2xl p-3 text-center">
        <div class="text-xs font-bold text-rose-600">Customer se lene hain</div>
        <div id="payDue" class="text-4xl font-black text-rose-700"></div>
      </div>
      <div class="grid grid-cols-4 gap-2" id="payModes"></div>
      <div id="cashBox" class="space-y-2">
        <label class="text-xs font-bold text-gray-500">Customer ne diye (₹)</label>
        <input id="payReceived" type="number" inputmode="decimal" oninput="updateChange()" class="w-full border-2 border-gray-300 rounded-xl px-3 py-3 text-xl font-black">
        <div id="payChips" class="flex flex-wrap gap-2"></div>
        <div id="payChange" class="text-center rounded-2xl p-3 font-black text-lg bg-gray-100 text-gray-500">Change: ₹0</div>
      </div>
      <div id="splitBox" class="hidden space-y-2">
        <div id="splitRows" class="space-y-2"></div>
        <div class="flex gap-2">
          <button onclick="addSplitRow()" id="splitAdd" class="flex-1 border-2 border-dashed border-gray-300 text-gray-600 rounded-xl py-2 font-black text-sm">+ Payment add karein</button>
          <button onclick="fillSplitRest()" class="px-4 border-2 border-orange-300 text-orange-700 rounded-xl font-black text-sm">Fill rest</button>
        </div>
        <div id="splitInfo" class="text-center rounded-2xl p-3 font-black text-lg bg-gray-100 text-gray-500"></div>
      </div>
      <button id="payConfirm" onclick="confirmPay()" class="w-full bg-orange-500 disabled:bg-gray-300 text-white py-3.5 rounded-2xl font-black">✔ Payment mili • Delivered</button>
    </div>
  </div>

  <script>
    var token = new URLSearchParams(location.search).get('t') || '';
    var knownIds = null, audioCtx = null, showHistory = false;

    // ---- Install as app (PWA) ----
    var installEvt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function() {});
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault(); installEvt = e;
      document.getElementById('btnInstall').classList.remove('hidden');
    });
    window.addEventListener('appinstalled', function() { installEvt = null; document.getElementById('btnInstall').classList.add('hidden'); });
    var inAppBrowser = /WhatsApp|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);
    // Always offer the button unless already running as an installed app (not every browser fires beforeinstallprompt)
    if (!isStandalone) document.addEventListener('DOMContentLoaded', function() { document.getElementById('btnInstall').classList.remove('hidden'); });

    function installApp() {
      if (installEvt) {
        installEvt.prompt();
        installEvt.userChoice.then(function() { installEvt = null; document.getElementById('btnInstall').classList.add('hidden'); });
      } else if (inAppBrowser) {
        alert('Ye link WhatsApp ke andar khula hai. Upar ke menu (⋮) se "Open in Chrome" chunein, phir wahan se Install App dabayein.');
      } else if (isIOS) {
        alert('iPhone par install karne ke liye: Safari mein Share button dabayein, phir "Add to Home Screen" chunein.');
      } else {
        var sw = navigator.serviceWorker && navigator.serviceWorker.controller ? 'ready' : 'abhi load ho raha hai';
        alert('Chrome menu (⋮) kholkar "Install app" ya "Add to Home screen" chunein.\n\nAgar option na dikhe: page ko ek baar refresh karke 10 second ruk kar dobara ye button dabayein.\n\n(Check: secure=' + window.isSecureContext + ', service worker=' + sw + ')');
      }
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    function beep() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.25, 0.5].forEach(function(t) {
          var o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
          g.gain.setValueAtTime(0.3, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
          o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
        });
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
      } catch (e) {}
    }

    function enableAlerts() {
      beep(); // a tap is needed before the browser allows sound
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
      document.getElementById('btnAlerts').innerText = '🔔 On';
    }

    function mapsUrl(o) {
      if (o.delivery_lat && o.delivery_lng) return 'https://www.google.com/maps/dir/?api=1&destination=' + o.delivery_lat + ',' + o.delivery_lng;
      return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(o.delivery_address || '');
    }

    function fmtTime(t) {
      var d = new Date(t);
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function splitText(o) {
      var parts = []; try { parts = JSON.parse(o.payment_split || '[]'); } catch (e) {}
      return parts.length ? parts.map(function(s) { return s.mode + ' ₹' + s.amount; }).join(' + ') : '';
    }

    function historyCard(o) {
      return '<div class="bg-white rounded-2xl shadow-sm p-3.5 space-y-1">' +
        '<div class="flex justify-between items-center"><div class="text-xl font-black text-gray-900">Token ' + esc(o.token_no || '-') + ' <span class="text-[11px] font-bold text-gray-400">ORD-' + o.id + '</span></div>' +
        '<span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Delivered ✓</span></div>' +
        '<div class="text-xs text-gray-500">' + fmtTime(o.delivered_at) + ' • ' + esc(o.customer_name || 'Guest') + '</div>' +
        '<div class="text-xs text-gray-600 line-clamp-1">📍 ' + (esc(o.delivery_address) || '-') + '</div>' +
        '<div class="text-xs font-bold text-gray-700">₹' + o.total + (splitText(o) ? ' • Split: ' + splitText(o) : (o.rider_cash_received ? ' • Cash mile ₹' + o.rider_cash_received + (Number(o.rider_cash_change) > 0 ? ', change ₹' + o.rider_cash_change : '') : '')) + '</div></div>';
    }

    function setTab(h) { showHistory = h; document.getElementById('list').innerHTML = ''; load(); }

    function card(o) {
      var done = !!o.delivered_at;
      var items = (o.items || []).map(function(i) { return esc(i.qty + ' x ' + i.name) + (i.user_note ? ' <i class="text-yellow-700">(' + esc(i.user_note) + ')</i>' : ''); }).join('<br>');
      var phone = String(o.customer_phone || '').replace(/[^0-9+]/g, '');
      return '<div class="bg-white rounded-2xl shadow p-4 space-y-3 ' + (done ? 'opacity-60' : 'border-2 border-orange-300') + '">' +
        '<div class="flex justify-between items-start"><div><div class="text-2xl font-black text-gray-900 leading-none">Token ' + esc(o.token_no || '-') + '</div><div class="text-[11px] font-bold text-gray-400 mt-1">ORD-' + o.id + '</div></div>' +
        (done ? '<span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Delivered ✓' + (splitText(o) ? ' • Split' : (o.rider_cash_received ? ' • ₹' + o.rider_cash_received + ' mile' : '')) + '</span>' :
          (o.to_collect > 0 ? '<span class="text-sm font-black bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full">Collect ₹' + o.to_collect + '</span>' : '<span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Paid ✓</span>')) + '</div>' +
        '<div class="text-sm text-gray-800"><div class="font-bold">👤 ' + esc(o.customer_name || 'Guest') + '</div>' +
        '<div class="text-gray-600 mt-0.5">📍 ' + (esc(o.delivery_address) || '<i>Address nahi hai</i>') + '</div></div>' +
        '<div class="text-xs text-gray-600 bg-gray-50 rounded-lg p-2">' + items + '</div>' +
        (done ? '' : '<div class="grid grid-cols-2 gap-2">' +
          ((o.delivery_address || o.delivery_lat) ? '<a href="' + mapsUrl(o) + '" target="_blank" class="bg-sky-500 text-white text-center py-3 rounded-xl font-black text-sm">🧭 Navigate</a>' : '<span class="bg-gray-200 text-gray-400 text-center py-3 rounded-xl font-black text-sm">🧭 No location</span>') +
          (phone ? '<a href="tel:' + phone + '" class="bg-emerald-500 text-white text-center py-3 rounded-xl font-black text-sm">📞 Call</a>' : '<span class="bg-gray-200 text-gray-400 text-center py-3 rounded-xl font-black text-sm">📞 No phone</span>') +
          '<button onclick="markDelivered(' + o.id + ')" class="col-span-2 bg-orange-500 text-white py-3 rounded-xl font-black text-sm">✔ Delivered</button></div>') +
        '</div>';
    }

    function load() {
      fetch('/api/rider/' + encodeURIComponent(token) + '/orders' + (showHistory ? '?history=1' : ''))
        .then(function(r) {
          return r.text().then(function(t) {
            var d; try { d = JSON.parse(t); } catch (e) { throw new Error('Is address (' + location.host + ') par POS server nahi mila. Manager se sahi rider link maangein.'); }
            if (!r.ok) throw new Error(d.error || 'Error');
            return d;
          });
        })
        .then(function(d) {
          document.getElementById('riderName').innerText = d.rider.name;
          var act = 'flex-1 py-2.5 text-sm font-black border-b-2 border-orange-500 text-orange-600', off = 'flex-1 py-2.5 text-sm font-black border-b-2 border-transparent text-gray-400';
          document.getElementById('tabActive').className = showHistory ? off : act;
          document.getElementById('tabHistory').className = showHistory ? act : off;
          if (showHistory) {
            document.getElementById('list').innerHTML = d.orders.length ? d.orders.map(historyCard).join('') : '<p class="text-center text-gray-400 italic py-16">Pichle 7 din mein koi delivery nahi</p>';
            return;
          }
          document.getElementById('tabActive').innerText = 'Active (' + d.orders.length + ')';
          var fresh = d.orders.map(function(o) { return o.id; });
          if (knownIds) {
            var added = fresh.filter(function(id) { return knownIds.indexOf(id) < 0; });
            if (added.length) {
              beep();
              if ('Notification' in window && Notification.permission === 'granted') new Notification('Naya delivery order', { body: 'ORD-' + added[0] + ' assign hua hai' });
            }
          }
          orders = d.orders;
          knownIds = fresh;
          document.getElementById('list').innerHTML = d.orders.length ? d.orders.map(card).join('') : '<p class="text-center text-gray-400 italic py-16">Abhi koi order assign nahi hai</p>';
        })
        .catch(function(err) {
          document.getElementById('list').innerHTML = '<p class="text-center text-red-600 font-bold py-16">' + esc(err.message) + '</p>';
        });
    }

    var orders = [], payOrder = null, payMode = 'CASH';

    function markDelivered(id) {
      var o = orders.filter(function(x) { return x.id === id; })[0];
      if (o && o.to_collect > 0) return openPay(o);
      if (!confirm('Order deliver ho gaya?')) return;
      sendDelivered(id, {});
    }

    function sendDelivered(id, body) {
      fetch('/api/rider/' + encodeURIComponent(token) + '/orders/' + id + '/delivered', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(function(r) { return r.json().then(function(d) { if (!r.ok) throw new Error(d.error || 'Error'); return d; }); })
        .then(function() { closePay(); load(); })
        .catch(function(err) { alert(err.message); });
    }

    function openPay(o) {
      payOrder = o; payMode = 'CASH';
      splitRows = [{ mode: 'CASH', amount: '' }, { mode: 'UPI', amount: '' }];
      document.getElementById('payOrd').innerText = 'Token ' + (o.token_no || o.id);
      document.getElementById('payDue').innerText = '₹' + o.to_collect;
      document.getElementById('payReceived').value = '';
      var amounts = [o.to_collect].concat([50, 100, 200, 500, 2000].filter(function(a) { return a > o.to_collect; }).slice(0, 3));
      document.getElementById('payChips').innerHTML = amounts.map(function(a, i) {
        return '<button onclick="setReceived(' + a + ')" class="px-3 py-1.5 rounded-full border-2 border-orange-300 text-orange-700 font-black text-sm">' + (i === 0 ? 'Exact ₹' : '₹') + a + '</button>';
      }).join('');
      renderModes();
      document.getElementById('payModal').classList.remove('hidden');
    }

    function renderModes() {
      document.getElementById('payModes').innerHTML = ['CASH', 'UPI', 'CARD', 'SPLIT'].map(function(m) {
        return '<button onclick="setMode(\'' + m + '\')" class="py-2.5 rounded-xl font-black text-xs border-2 ' + (m === payMode ? 'bg-orange-500 text-white border-orange-600' : 'bg-white text-gray-700 border-gray-300') + '">' + m + '</button>';
      }).join('');
      document.getElementById('cashBox').classList.toggle('hidden', payMode !== 'CASH');
      document.getElementById('splitBox').classList.toggle('hidden', payMode !== 'SPLIT');
      if (payMode === 'SPLIT') renderSplit();
      updateChange();
    }

    function setMode(m) { payMode = m; renderModes(); }
    function setReceived(a) { document.getElementById('payReceived').value = a; updateChange(); }

    function updateChange() {
      if (!payOrder) return;
      var btn = document.getElementById('payConfirm'), box = document.getElementById('payChange');
      if (payMode === 'SPLIT') return updateSplit();
      if (payMode !== 'CASH') { btn.disabled = false; return; }
      var rec = parseFloat(document.getElementById('payReceived').value);
      var ok = isFinite(rec) && rec >= payOrder.to_collect;
      btn.disabled = !ok;
      if (!isFinite(rec) || rec <= 0) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-gray-100 text-gray-500'; box.innerText = 'Change: ₹0'; }
      else if (!ok) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-rose-100 text-rose-700'; box.innerText = '₹' + (Math.round((payOrder.to_collect - rec) * 100) / 100) + ' kam hain'; }
      else { box.className = 'text-center rounded-2xl p-3 font-black text-2xl bg-emerald-100 text-emerald-800'; box.innerText = 'Wapas dein: ₹' + (Math.round((rec - payOrder.to_collect) * 100) / 100); }
    }

    // ---- split payment: cash / UPI / card parts must add up to the amount due ----
    var splitRows = [];
    var r2 = function(n) { return Math.round((Number(n) || 0) * 100) / 100; };
    function readSplit() {
      splitRows.forEach(function(r, i) { var el = document.getElementById('splitAmt' + i); if (el) r.amount = el.value; });
    }
    function renderSplit() {
      document.getElementById('splitRows').innerHTML = splitRows.map(function(r, i) {
        var modes = ['CASH', 'UPI', 'CARD'].map(function(m) { return '<option value="' + m + '"' + (m === r.mode ? ' selected' : '') + '>' + m + '</option>'; }).join('');
        return '<div class="flex items-center gap-2"><select onchange="splitRows[' + i + '].mode = this.value" class="border-2 border-gray-300 rounded-xl px-2 py-3 font-black text-sm bg-white">' + modes + '</select>' +
          '<input id="splitAmt' + i + '" type="number" inputmode="decimal" placeholder="₹ amount" value="' + (r.amount === '' ? '' : r.amount) + '" oninput="updateSplit()" class="flex-1 min-w-0 border-2 border-gray-300 rounded-xl px-3 py-3 text-lg font-black">' +
          (splitRows.length > 2 ? '<button onclick="removeSplitRow(' + i + ')" class="text-rose-500 text-xl font-black px-1">✕</button>' : '') + '</div>';
      }).join('');
      document.getElementById('splitAdd').classList.toggle('hidden', splitRows.length >= 4);
    }
    function addSplitRow() { readSplit(); if (splitRows.length < 4) { splitRows.push({ mode: 'CARD', amount: '' }); renderSplit(); updateSplit(); } }
    function removeSplitRow(i) { readSplit(); if (splitRows.length > 2) { splitRows.splice(i, 1); renderSplit(); updateSplit(); } }
    function fillSplitRest() {
      readSplit();
      var other = splitRows.reduce(function(t, r, i) { return t + (r.amount === '' ? 0 : (parseFloat(r.amount) || 0)); }, 0);
      var empty = splitRows.map(function(r, i) { return r.amount === '' || !(parseFloat(r.amount) > 0) ? i : -1; }).filter(function(i) { return i >= 0; });
      var idx = empty.length ? empty[0] : splitRows.length - 1;
      var others = splitRows.reduce(function(t, r, i) { return i === idx ? t : t + (parseFloat(r.amount) || 0); }, 0);
      splitRows[idx].amount = String(Math.max(0, r2(payOrder.to_collect - others)));
      renderSplit(); updateSplit();
    }
    function splitParts() {
      readSplit();
      return splitRows.map(function(r) { return { mode: r.mode, amount: r2(parseFloat(r.amount)) }; }).filter(function(r) { return r.amount > 0; });
    }
    function updateSplit() {
      if (!payOrder || payMode !== 'SPLIT') return;
      var parts = splitParts(), sum = r2(parts.reduce(function(t, p) { return t + p.amount; }, 0)), diff = r2(payOrder.to_collect - sum);
      var ok = parts.length >= 2 && Math.abs(diff) < 0.01;
      document.getElementById('payConfirm').disabled = !ok;
      var box = document.getElementById('splitInfo');
      if (Math.abs(diff) < 0.01 && parts.length >= 2) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-emerald-100 text-emerald-800'; box.innerText = 'Total barabar ✓ ₹' + sum; }
      else if (diff > 0) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-rose-100 text-rose-700'; box.innerText = 'Abhi ₹' + diff + ' baaki hain'; }
      else if (diff < 0) { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-rose-100 text-rose-700'; box.innerText = '₹' + r2(-diff) + ' zyada hain'; }
      else { box.className = 'text-center rounded-2xl p-3 font-black text-lg bg-gray-100 text-gray-500'; box.innerText = 'Kam se kam 2 payment daalein'; }
    }

    // UPI (alone or as a split part) is paid through a QR first; the delivery is marked only after the payment is confirmed
    var payBusy = false;
    async function confirmPay() {
      if (!payOrder || payBusy) return;
      payBusy = true;
      try {
        var tok = 'Token ' + (payOrder.token_no || payOrder.id), id = payOrder.id;
        if (payMode === 'SPLIT') {
          var parts = splitParts();
          for (var i = 0; i < parts.length; i++) { if (parts[i].mode === 'UPI' && !(await collectUpi(parts[i].amount, tok + ' • split UPI part'))) return; }
          return sendDelivered(id, { mode: 'SPLIT', splits: parts });
        }
        if (payMode === 'UPI' && !(await collectUpi(payOrder.to_collect, tok))) return;
        sendDelivered(id, { mode: payMode, received: parseFloat(document.getElementById('payReceived').value) });
      } finally { payBusy = false; }
    }

    // ================= UPI QR COLLECT (callback-confirmed) =================
    // collectUpi(amount, label) -> Promise<boolean>: true once the payment is confirmed (by Paytm callback, or by the person pressing "Payment aa gayi").
    var ucState = null;
    function ucClose(result) {
      if (!ucState) return;
      var st = ucState; ucState = null;
      clearInterval(st.timer);
      document.getElementById('upiCollectModal').classList.add('hidden');
      st.resolve(result);
    }
    function collectUpi(amount, label) {
      return new Promise(function(resolve) {
        amount = Math.round((Number(amount) || 0) * 100) / 100;
        if (!(amount > 0)) return resolve(true);
        fetch('/api/upi/collect', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ amount: amount, label: label || '' }) })
          .then(function(r) { return r.json().then(function(d) { if (!r.ok) throw new Error(d.error || 'QR nahi ban paaya'); return d; }); })
          .then(function(d) {
            ucState = { id: d.paytmOrderId, amount: amount, resolve: resolve, timer: null };
            document.getElementById('ucAmount').innerText = '₹' + amount;
            document.getElementById('ucLabel').innerText = label || '';
            document.getElementById('ucQr').src = d.qrImage;
            document.getElementById('ucStatus').innerText = 'Payment ka intezaar...';
            document.getElementById('upiCollectModal').classList.remove('hidden');
            var st = ucState;
            st.timer = setInterval(function() {
              fetch('/api/upi/status/' + encodeURIComponent(st.id)).then(function(r) { return r.json(); }).then(function(s) {
                if (ucState !== st) return;
                if (s.status === 'PAID') { document.getElementById('ucStatus').innerText = '✅ Payment mil gayi'; setTimeout(function() { if (ucState === st) ucClose(true); }, 600); clearInterval(st.timer); }
                else if (s.status === 'EXPIRED') { ucClose(false); window.alert('QR expire ho gaya. Dobara try karein.'); }
              }).catch(function() {});
            }, 2000);
          })
          .catch(function(e) {
            // QR could not be made (UPI not set up / network): fall back to the old way, the person confirms the money by hand
            Promise.resolve(window.confirm('QR nahi ban paaya (' + e.message + '). Kya ₹' + amount + ' UPI se mil gaye? Haan = manual maan lein.')).then(function(yes) { resolve(!!yes); });
          });
      });
    }
    function ucCancel() {
      if (!ucState) return;
      var id = ucState.id;
      // last check first: a payment made at the very last second must not be lost
      fetch('/api/upi/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paytmOrderId: id }) })
        .then(function(r) { return r.json(); }).then(function(s) { ucClose(s.status === 'PAID'); }).catch(function() { ucClose(false); });
    }
    function ucManual() {
      if (!ucState) return;
      Promise.resolve(window.confirm('Paytm app / soundbox me ₹' + ucState.amount + ' aa gaya? Tabhi "Haan" karein.')).then(function(yes) {
        if (!yes || !ucState) return;
        var id = ucState.id;
        fetch('/api/upi/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paytmOrderId: id }) }).catch(function() {});
        ucClose(true);
      });
    }

    function closePay() { payOrder = null; document.getElementById('payModal').classList.add('hidden'); }

    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
