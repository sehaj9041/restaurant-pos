<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Display</title>
  <script src="/login-guard.js"></script>
  <!-- Old Android TV WebViews: no Tailwind CDN, plain CSS (flex + margins, no gap/inset), ES5 JS only (same approach as kitchen.html) -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #0f172a; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-user-select: none; user-select: none; }
    .top { background: #1e293b; padding: 14px 32px; border-bottom: 1px solid #334155; display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; }
    .top h1 { font-size: 30px; font-weight: 900; letter-spacing: 1px; }
    .top span { font-size: 22px; font-weight: bold; color: #cbd5e1; }
    .cols { -webkit-flex: 1; flex: 1; min-height: 0; display: -webkit-flex; display: flex; padding: 20px; }
    .col { -webkit-flex: 1; flex: 1; min-width: 0; border-radius: 24px; padding: 22px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; margin: 0 10px; }
    .col.prep { background: rgba(30,41,59,.6); border: 1px solid rgba(245,158,11,.35); }
    .col.rdy { background: rgba(6,78,59,.35); border: 1px solid rgba(16,185,129,.45); }
    .col h2 { font-size: 30px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }
    .prep h2 { color: #fbbf24; } .rdy h2 { color: #34d399; }
    .col p.sub { color: #94a3b8; font-size: 14px; margin: 4px 0 16px; }
    .list { -webkit-flex: 1; flex: 1; min-height: 0; overflow: hidden; display: block; }   /* inline-block tokens: old WebViews stretch flex-wrap rows to the full height */
    .tok { display: inline-block; vertical-align: top; font-weight: 900; margin: 0 12px 12px 0; text-align: center; }
    .tok.p { font-size: 48px; padding: 10px 24px; border-radius: 16px; color: #fcd34d; background: rgba(245,158,11,.15); border: 1px solid rgba(251,191,36,.5); }
    .tok.r { font-size: 72px; padding: 16px 34px; border-radius: 24px; color: #fff; background: #10b981; box-shadow: 0 6px 18px rgba(0,0,0,.4); margin: 0 16px 16px 0; }
    .empty { color: #64748b; font-size: 22px; font-weight: bold; }
    .foot { -webkit-flex-shrink: 0; flex-shrink: 0; background: #1e293b; border-top: 1px solid #334155; padding: 10px 32px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
    .foot img { width: 96px; height: 96px; background: #fff; border-radius: 10px; padding: 4px; margin-right: 24px; }
    .foot .t1 { font-size: 26px; font-weight: 900; color: #fbbf24; }
    .foot .t2 { font-size: 18px; color: #cbd5e1; margin-top: 4px; }
    #gate { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.85); z-index: 50; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
    #gate button { background: #10b981; color: #fff; font-weight: 900; font-size: 30px; padding: 30px 48px; border: 0; border-radius: 24px; }
    #banner { display: none; position: fixed; left: 0; right: 0; top: 28%; z-index: 40; text-align: center; pointer-events: none; }
    #banner .box { display: inline-block; background: #10b981; color: #fff; border-radius: 32px; padding: 30px 80px; box-shadow: 0 10px 40px rgba(0,0,0,.6); -webkit-animation: pop .45s ease-out; animation: pop .45s ease-out; }
    #banner .l { font-size: 30px; font-weight: bold; text-transform: uppercase; letter-spacing: 4px; }
    #banner .n { font-size: 144px; line-height: 1.05; font-weight: 900; }
    @-webkit-keyframes pop { 0% { -webkit-transform: scale(.6); opacity: 0 } 60% { -webkit-transform: scale(1.08) } 100% { -webkit-transform: scale(1); opacity: 1 } }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.08) } 100% { transform: scale(1); opacity: 1 } }
  </style>
</head>
<body>

  <div class="top"><h1>VISHAL FOODIEZ</h1><span id="clock"></span></div>

  <div class="cols">
    <div class="col prep">
      <h2>&#128104;&#8205;&#127859; Preparing</h2>
      <p class="sub">Aapka order ban raha hai</p>
      <div id="preparing" class="list"></div>
    </div>
    <div class="col rdy">
      <h2>&#9989; Ready</h2>
      <p class="sub">Counter se apna order le lein</p>
      <div id="ready" class="list"></div>
    </div>
  </div>

  <!-- Rate-us QR: feedback without an order, then a Google review button (feedback.html?g=1) -->
  <div class="foot" id="rateFoot">
    <img src="/api/feedback/qr-general" alt="Rate us" onerror="document.getElementById('rateFoot').style.display='none'">
    <div><div class="t1">&#11088; Khana pasand aaya?</div><div class="t2">Scan karke feedback dein aur Google par rate karein</div></div>
  </div>

  <!-- Desktop browsers block sound until someone clicks once (the Android TV app skips this) -->
  <div id="gate"><button id="gateBtn" onclick="enableSound()">&#128266; Tap to start (sound on)</button></div>

  <div id="banner"><div class="box"><div class="l">Token</div><div class="n" id="bannerNo"></div><div class="l" style="letter-spacing:0">is ready!</div></div></div>

<script>
  var soundOn = false, announced = null, queue = [], speaking = false, audioCtx = null;
  function $(id) { return document.getElementById(id); }
  function fmt(n) { var s = String(n); while (s.length < 3) s = '0' + s; return s; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function enableSound() {
    soundOn = true;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    $('gate').style.display = 'none';
  }

  function chime() {
    if (!audioCtx) return wait(0);
    try {
      [660, 880, 1100, 880, 1320].forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.3;
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.8);
      });
    } catch (e) {}
    return wait(1700);
  }

  // Voice = pre-recorded clips ("Token number" + each digit + "is ready"), played one after another.
  // Old TV WebViews often have no speechSynthesis and the TV may have no text-to-speech engine, but plain audio always plays.
  var clips = {};
  function clip(name) {
    if (!clips[name]) { var a = new Audio('/token-voice/' + name + '.m4a?v=3'); a.preload = 'auto'; clips[name] = a; }
    return clips[name];
  }
  function playClip(name, maxMs, onFail) {
    return new Promise(function (done) {
      try {
        var a = clip(name), finished = false;
        var end = function () { if (!finished) { finished = true; done(); } };
        a.onended = end; a.onerror = function () { if (onFail) onFail(); end(); };
        try { a.currentTime = 0; } catch (e) {}
        var pr = a.play();
        if (pr && pr.catch) pr.catch(function () { if (onFail) onFail(); end(); });
        setTimeout(end, maxMs || 2500);   // never get stuck on one clip
      } catch (e) { done(); }
    });
  }
  // 123 -> "one" "twenty three"; 105 -> "one" "oh" "five"; 200 -> "two" "hundred"; 45 -> "forty five"
  function numberClips(n) {
    if (n < 100) return [n];
    var h = Math.floor(n / 100), r = n % 100;
    if (n >= 1000) return String(n).split('');
    return [h].concat(r === 0 ? ['hundred'] : r < 10 ? ['oh', r] : [r]);
  }
  function speakToken(t) {
    // one full-sentence clip per token (no gaps); falls back to word-by-word clips if it is missing or the number is above 500
    var n = Number(t);
    if (n >= 1 && n <= 500) {
      var failed = false;
      return playClip('full/' + n, 12000, function () { failed = true; }).then(function () { return failed ? speakParts(t) : null; });
    }
    return speakParts(t);
  }
  function speakParts(t) {
    var names = ['attention'].concat(numberClips(Number(t)), ['ready']), i = 0;
    return new Promise(function (done) {
      (function next() { if (i >= names.length) return done(); playClip(names[i++]).then(function () { setTimeout(next, 60); }); })();
    });
  }
  (function preload() { var n = ['attention', 'ready', 'hundred', 'oh'], i; for (i = 1; i < 100; i++) n.push(i); for (i = 0; i < n.length; i++) clip(n[i]); })();

  // one token at a time: chime, banner, then voice
  function runQueue() {
    if (speaking) return;
    if (!queue.length) return;
    speaking = true;
    var t = queue.shift();
    $('bannerNo').innerText = fmt(t);
    $('banner').style.display = 'block';
    var p = soundOn ? chime().then(function () { return speakToken(t); }) : wait(3500);
    p.then(function () { return wait(300); }).then(function () {
      $('banner').style.display = 'none';
      speaking = false;
      runQueue();
    });
  }

  function render(d) {
    var prep = '', rdy = '', i;
    for (i = 0; i < d.preparing.length; i++) prep += '<div class="tok p">' + fmt(d.preparing[i]) + '</div>';
    for (i = 0; i < d.ready.length; i++) rdy += '<div class="tok r">' + fmt(d.ready[i]) + '</div>';
    $('preparing').innerHTML = prep || '<div class="empty">Koi order preparing me nahi</div>';
    $('ready').innerHTML = rdy || '<div class="empty">Abhi koi order ready nahi</div>';

    if (announced === null) { announced = {}; for (i = 0; i < d.ready.length; i++) announced[d.ready[i]] = true; return; }   // first load: do not announce what was already ready
    var cur = {}, fresh = [];
    for (i = 0; i < d.ready.length; i++) cur[d.ready[i]] = true;
    for (var k in announced) if (!cur[k]) delete announced[k];   // left the list (e.g. recalled): can be announced again later
    for (i = 0; i < d.ready.length; i++) if (!announced[d.ready[i]]) { announced[d.ready[i]] = true; fresh.push(d.ready[i]); }
    for (i = fresh.length - 1; i >= 0; i--) queue.push(fresh[i]);   // d.ready is newest first: oldest ready token speaks first
    runQueue();
  }

  function poll() {
    fetch('/api/token-display', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d) render(d); }).catch(function () {});
  }
  setInterval(poll, 3000); poll();
  function tick() { var n = new Date(), h = n.getHours(), m = n.getMinutes(); $('clock').innerText = ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m + (h >= 12 ? ' PM' : ' AM'); }
  setInterval(tick, 1000); tick();

  if (window.TokenTV) enableSound();   // TV app: no remote click needed
  else $('gateBtn').focus();
</script>
</body>
</html>
