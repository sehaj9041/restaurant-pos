<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Kitchen Display (KOT)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .badge-alert {
      animation: pulse-ring 1.5s infinite;
    }
    input[type=range]::-webkit-slider-thumb {
      background: #ea580c;
      cursor: pointer;
    }

    /* DYNAMIC CARD SCALING & AUTO-FLOW GRID ENGINE */
    :root {
      --kot-scale: 1;
      --kot-card-min-width: 290px;
    }

    #kotGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--kot-card-min-width), 1fr));
      gap: calc(16px * var(--kot-scale));
      align-items: start;
    }

    .kot-card-box {
      font-size: calc(14px * var(--kot-scale));
    }
    .kot-card-box h3 {
      font-size: calc(20px * var(--kot-scale));
    }
    .kot-card-box .kot-item-title {
      font-size: calc(15px * var(--kot-scale));
    }
    /* BIGGER & PROMINENT QUANTITY FONT */
    .kot-card-box .kot-qty-badge {
      font-size: calc(18px * var(--kot-scale));
      line-height: 1;
    }
    .kot-card-box .kot-btn {
      font-size: calc(14px * var(--kot-scale));
      padding-top: calc(10px * var(--kot-scale));
      padding-bottom: calc(10px * var(--kot-scale));
    }
    .kot-card-box .kot-timer {
      font-size: calc(12px * var(--kot-scale));
    }
    .kot-card-box .kot-badge {
      font-size: calc(11px * var(--kot-scale));
    }
    .kot-card-box .kot-notes {
      font-size: calc(12px * var(--kot-scale));
    }
    .kot-card-box .kot-check-box {
      width: calc(22px * var(--kot-scale));
      height: calc(22px * var(--kot-scale));
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans text-slate-800 select-none">

  <!-- TOP HEADER (LOCKED & CLEAN LIGHT BAR) -->
  <div class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4 flex-wrap gap-4 bg-white p-4 rounded-2xl shadow-xs">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-wide text-slate-900">Live Kitchen Orders</h1>
    </div>
    
    <div class="flex items-center gap-3 flex-wrap">
      <!-- CARD SIZE SCROLLER -->
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg shadow-2xs">
        <span class="text-xs font-bold text-slate-600 flex items-center gap-1">
          <span>🔍</span> <span>Size:</span>
        </span>
        <input 
          type="range" 
          id="kotSizeSlider" 
          min="65" 
          max="140" 
          value="100" 
          step="5"
          oninput="changeKOTCardScale(this.value)"
          class="w-24 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-orange-500"
        />
        <span id="lblSizePercent" class="text-[11px] font-mono font-bold text-orange-600 w-9 text-right">100%</span>
        <button onclick="resetKOTCardScale()" title="Reset Size" class="text-slate-400 hover:text-slate-800 text-xs px-1 font-bold">↺</button>
      </div>

      <!-- FULLSCREEN TOGGLE BUTTON -->
      <button id="btnFullScreen" onclick="toggleFullScreen()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-2xs">
        <span id="fullScreenIcon">⛶</span> <span id="fullScreenText">Fullscreen</span>
      </button>

      <!-- AUDIO ALERT TOGGLE (PERSISTENT STATE) -->
      <button id="btnAudioToggle" onclick="toggleAudioSetting()" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-2xs">
        <span>🔔</span> <span id="lblAudioStatus">Sound Alert Active</span>
      </button>

      <span id="pendingCount" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm shadow-2xs">0 Pending</span>
      <a href="/" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-2xs">
        ← POS Counter
      </a>
    </div>
  </div>

  <!-- AUTO-FLOW RESPONSIVE GRID -->
  <div id="kotGrid">
    <div class="col-span-full text-center py-24 text-slate-400 font-bold text-lg">No active orders right now.</div>
  </div>

  <script>
    var audioCtx = null;
    var isAudioAllowed = true;
    var liveOrdersData = [];

    // ================= SOUND PERSISTENCE & AUDIO UNLOCK =================
    function initPersistentAudio() {
      var savedSoundState = localStorage.getItem('kot_sound_enabled');
      if (savedSoundState === null || savedSoundState === 'true') {
        isAudioAllowed = true;
        updateAudioButtonUI(true);
      } else {
        isAudioAllowed = false;
        updateAudioButtonUI(false);
      }
    }

    function toggleAudioSetting() {
      isAudioAllowed = !isAudioAllowed;
      localStorage.setItem('kot_sound_enabled', isAudioAllowed ? 'true' : 'false');
      updateAudioButtonUI(isAudioAllowed);
      if (isAudioAllowed) {
        unlockAudioEngine();
        playKOTBeepSound();
      }
    }

    function updateAudioButtonUI(active) {
      var btn = document.getElementById('btnAudioToggle');
      var lbl = document.getElementById('lblAudioStatus');
      if (!btn || !lbl) return;

      if (active) {
        btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-2xs";
        lbl.innerText = "Sound Alert Active";
      } else {
        btn.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 border border-slate-300 shadow-2xs";
        lbl.innerText = "Sound Muted";
      }
    }

    function unlockAudioEngine() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Audio context pending interaction:', e);
      }
    }

    function playKOTBeepSound() {
      if (!isAudioAllowed) return;

      try {
        unlockAudioEngine();
        if (!audioCtx) return;

        var now = audioCtx.currentTime;
        
        var osc1 = audioCtx.createOscillator();
        var gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        var osc2 = audioCtx.createOscillator();
        var gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1318.51, now + 0.12);
        gain2.gain.setValueAtTime(0.45, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.65);
      } catch (err) {
        console.warn('Audio awaiting interaction:', err);
      }
    }

    // ================= DYNAMIC CARD & BOX SCALING =================
    function initCardScale() {
      var savedScale = localStorage.getItem('kot_display_scale') || '100';
      var slider = document.getElementById('kotSizeSlider');
      if (slider) slider.value = savedScale;
      applyDynamicCardWidthAndScale(savedScale);
    }

    function changeKOTCardScale(val) {
      applyDynamicCardWidthAndScale(val);
      localStorage.setItem('kot_display_scale', val);
    }

    function applyDynamicCardWidthAndScale(val) {
      var label = document.getElementById('lblSizePercent');
      if (label) label.innerText = val + '%';
      
      var numericScale = Number(val) / 100;
      var calculatedWidth = Math.round(300 * numericScale);

      document.documentElement.style.setProperty('--kot-scale', numericScale);
      document.documentElement.style.setProperty('--kot-card-min-width', calculatedWidth + 'px');
    }

    function resetKOTCardScale() {
      var slider = document.getElementById('kotSizeSlider');
      if (slider) slider.value = 100;
      changeKOTCardScale(100);
    }

    // ================= FULLSCREEN TOGGLE LOGIC =================
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(err) {
          console.warn("Fullscreen error:", err.message);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', function() {
      var icon = document.getElementById('fullScreenIcon');
      var txt = document.getElementById('fullScreenText');
      if (document.fullscreenElement) {
        icon.innerText = "⛷";
        txt.innerText = "Exit Fullscreen";
      } else {
        icon.innerText = "⛶";
        txt.innerText = "Fullscreen";
      }
    });

    // ================= LOCAL STORAGE PERSISTENCE =================
    function getStoredSnapshots() {
      try {
        return JSON.parse(localStorage.getItem('kot_order_snapshots') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStoredSnapshots(snapshots) {
      localStorage.setItem('kot_order_snapshots', JSON.stringify(snapshots));
    }

    function getCheckedItemKeys() {
      try {
        return JSON.parse(localStorage.getItem('kot_checked_items') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveCheckedItemKeys(store) {
      localStorage.setItem('kot_checked_items', JSON.stringify(store));
    }

    function getAlertBadges() {
      try {
        return JSON.parse(localStorage.getItem('kot_alert_badges') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveAlertBadges(badges) {
      localStorage.setItem('kot_alert_badges', JSON.stringify(badges));
    }

    function getReadyForDispatchOrders() {
      try {
        return JSON.parse(localStorage.getItem('kot_ready_dispatch') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveReadyForDispatchOrders(store) {
      localStorage.setItem('kot_ready_dispatch', JSON.stringify(store));
    }

    function toggleItemReady(orderId, rowIdentifier) {
      var store = getCheckedItemKeys();
      var key = orderId + '_' + rowIdentifier;
      store[key] = !store[key];
      saveCheckedItemKeys(store);
      renderKOTCards();
    }

    function markReadyStage(id) {
      var strId = id.toString();
      var readyStore = getReadyForDispatchOrders();
      readyStore[strId] = true;
      saveReadyForDispatchOrders(readyStore);

      var checkedMap = getCheckedItemKeys();
      var targetOrder = liveOrdersData.find(function(o){ return o.id.toString() === strId; });
      if (targetOrder) {
        (targetOrder.items || []).forEach(function(item, idx) {
          checkedMap[strId + '_row_' + idx] = true;
        });
        saveCheckedItemKeys(checkedMap);
      }

      renderKOTCards();
    }

    function undoReadyStage(id) {
      var strId = id.toString();
      var readyStore = getReadyForDispatchOrders();
      delete readyStore[strId];
      saveReadyForDispatchOrders(readyStore);
      renderKOTCards();
    }

    function executeDispatch(id) {
      var strId = id.toString();
      var snapshots = getStoredSnapshots();
      var checkedMap = getCheckedItemKeys();
      var readyStore = getReadyForDispatchOrders();

      if (snapshots[strId]) {
        snapshots[strId].wasCompletedBefore = true;
        var rCount = snapshots[strId].rowsCount || 0;
        for (var i = 0; i < rCount; i++) {
          checkedMap[strId + '_row_' + i] = true;
        }
      }

      var badges = getAlertBadges();
      Object.keys(badges).forEach(function(k) {
        if (k.startsWith(strId + '_')) delete badges[k];
      });

      delete readyStore[strId];

      saveStoredSnapshots(snapshots);
      saveCheckedItemKeys(checkedMap);
      saveAlertBadges(badges);
      saveReadyForDispatchOrders(readyStore);

      fetch('/api/kot/' + id + '/complete', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() { fetchKOT(); });
    }

    function updateLiveTimers() {
      var now = Date.now();
      liveOrdersData.forEach(function(order) {
        var timerEl = document.getElementById('kotTimer_' + order.id);
        if (!timerEl) return;

        var startTime = order.created_at ? new Date(order.created_at).getTime() : now;
        var diffSec = Math.max(0, Math.floor((now - startTime) / 1000));

        var mins = Math.floor(diffSec / 60);
        var secs = diffSec % 60;
        var formatted = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;

        timerEl.innerText = formatted;

        if (mins >= 10) {
          timerEl.className = "kot-timer text-rose-700 font-mono font-black bg-rose-50 px-2 py-0.5 rounded border border-rose-300 animate-pulse";
        } else if (mins >= 5) {
          timerEl.className = "kot-timer text-amber-800 font-mono font-black bg-amber-50 px-2 py-0.5 rounded border border-amber-300";
        } else {
          timerEl.className = "kot-timer text-slate-700 font-mono font-bold bg-slate-100 px-2 py-0.5 rounded border border-slate-200";
        }
      });
    }

    function fetchKOT() {
      fetch('/api/kot')
        .then(function(res) { return res.json(); })
        .then(function(orders) {
          liveOrdersData = orders || [];
          document.getElementById('pendingCount').innerText = liveOrdersData.length + ' Pending';

          var snapshots = getStoredSnapshots();
          var persistentBadges = getAlertBadges();
          var checkedMap = getCheckedItemKeys();
          var readyStore = getReadyForDispatchOrders();
          var shouldPlaySound = false;

          liveOrdersData.forEach(function(order) {
            var orderId = order.id.toString();
            var prevSnapshot = snapshots[orderId];
            var currentItems = order.items || [];

            if (!prevSnapshot) {
              shouldPlaySound = true;
              snapshots[orderId] = {
                rowsCount: currentItems.length,
                rowsQty: currentItems.map(function(i){ return Number(i.qty) || 1; }),
                wasCompletedBefore: false
              };
            } else {
              var prevRowsCount = prevSnapshot.rowsCount || 0;
              var prevRowsQty = prevSnapshot.rowsQty || [];

              if (currentItems.length > prevRowsCount) {
                shouldPlaySound = true;
                delete readyStore[orderId];
                for (var idx = prevRowsCount; idx < currentItems.length; idx++) {
                  var itemRowKey = orderId + '_row_' + idx;
                  persistentBadges[itemRowKey] = 'NEW';
                  delete checkedMap[itemRowKey];
                }
              }

              currentItems.forEach(function(item, idx) {
                var currentQty = Number(item.qty) || 1;
                var prevQty = prevRowsQty[idx];

                if (prevQty !== undefined && currentQty > prevQty) {
                  var diff = currentQty - prevQty;
                  var rowKey = orderId + '_row_' + idx;
                  persistentBadges[rowKey] = '+' + diff + ' QTY';
                  delete checkedMap[rowKey];
                  delete readyStore[orderId];
                  shouldPlaySound = true;
                }
              });

              if (prevSnapshot.wasCompletedBefore && (currentItems.length > prevRowsCount || shouldPlaySound)) {
                for (var p = 0; p < prevRowsCount; p++) {
                  var rKey = orderId + '_row_' + p;
                  if (!persistentBadges[rKey]) {
                    checkedMap[rKey] = true;
                  }
                }
                prevSnapshot.wasCompletedBefore = false;
              }

              snapshots[orderId].rowsCount = currentItems.length;
              snapshots[orderId].rowsQty = currentItems.map(function(i){ return Number(i.qty) || 1; });
            }
          });

          var currentOrderIds = new Set(liveOrdersData.map(function(o){ return o.id.toString(); }));
          Object.keys(snapshots).forEach(function(id) {
            if (!currentOrderIds.has(id)) delete snapshots[id];
          });
          Object.keys(persistentBadges).forEach(function(key) {
            var ordId = key.split('_')[0];
            if (!currentOrderIds.has(ordId)) delete persistentBadges[key];
          });
          Object.keys(readyStore).forEach(function(id) {
            if (!currentOrderIds.has(id)) delete readyStore[id];
          });

          saveStoredSnapshots(snapshots);
          saveAlertBadges(persistentBadges);
          saveCheckedItemKeys(checkedMap);
          saveReadyForDispatchOrders(readyStore);

          if (shouldPlaySound) {
            playKOTBeepSound();
          }

          renderKOTCards();
        })
        .catch(function(){});
    }

    function renderKOTCards() {
      var grid = document.getElementById('kotGrid');
      if (!liveOrdersData || liveOrdersData.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-24 text-slate-400 font-bold text-lg">No active orders right now.</div>';
        return;
      }

      var persistentBadges = getAlertBadges();
      var checkedMap = getCheckedItemKeys();
      var readyStore = getReadyForDispatchOrders();

      grid.innerHTML = liveOrdersData.map(function(order) {
        var strId = order.id.toString();
        var isReadyForDispatch = !!readyStore[strId];

        var allItemsReady = (order.items || []).every(function(item, idx) {
          return !!checkedMap[order.id + '_row_' + idx];
        });

        var theme = {
          border: 'border-blue-200',
          badgeBg: 'bg-blue-50 text-blue-700 border-blue-200',
          headerBg: 'bg-blue-50/50',
          emoji: '🪑🍽️',
          label: 'Dine-In'
        };

        if (order.order_type === 'Takeaway') {
          theme = {
            border: 'border-emerald-200',
            badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            headerBg: 'bg-emerald-50/50',
            emoji: '🛍️',
            label: 'Takeaway'
          };
        } else if (order.order_type === 'Delivery') {
          theme = {
            border: 'border-purple-200',
            badgeBg: 'bg-purple-50 text-purple-700 border-purple-200',
            headerBg: 'bg-purple-50/50',
            emoji: '🛵',
            label: 'Delivery'
          };
        }

        var cardBorderClass = isReadyForDispatch 
          ? 'border-emerald-500 bg-emerald-50/40 shadow-emerald-100 ring-2 ring-emerald-500/40' 
          : (allItemsReady ? 'border-emerald-500 shadow-emerald-50' : theme.border);

        return `
          <!-- LIGHT THEME KOT CARD -->
          <div class="kot-card-box bg-white border-2 ${cardBorderClass} rounded-2xl flex flex-col justify-between overflow-hidden shadow-xs hover:shadow-md transition self-start w-full">
            <!-- HEADER -->
            <div class="p-3.5 border-b border-slate-100 ${theme.headerBg} flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-black text-slate-900">#${order.id}</h3>
                  <span class="kot-badge font-black px-2 py-0.5 rounded-md border ${theme.badgeBg} flex items-center gap-1 shadow-2xs">
                    <span>${theme.emoji}</span>
                    <span>${theme.label}</span>
                    ${order.table_no ? `<span>• ${order.table_no}</span>` : ''}
                  </span>
                </div>
                <div class="kot-notes text-slate-500 font-mono mt-0.5">Time: ${order.time || ''}</div>
              </div>

              <!-- LIVE 00:00 TIMER -->
              <div class="flex flex-col items-end">
                <span class="kot-notes font-bold text-slate-400 uppercase tracking-wider mb-0.5">Elapsed</span>
                <span id="kotTimer_${order.id}" class="kot-timer text-slate-700 font-mono font-bold bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                  00:00
                </span>
              </div>
            </div>

            <!-- READY STATUS BANNER -->
            ${isReadyForDispatch ? `
              <div class="bg-emerald-100/70 border-b border-emerald-200 px-3 py-1.5 flex justify-between items-center">
                <span class="kot-badge font-black text-emerald-800 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  READY FOR PICKUP
                </span>
                <button onclick="undoReadyStage(${order.id})" class="kot-notes font-bold text-slate-500 hover:text-slate-900 underline">
                  Undo
                </button>
              </div>
            ` : ''}

            <!-- ITEMS LIST -->
            <div class="p-3.5 space-y-2">
              ${(order.items || []).map(function(item, idx) {
                var rowKey = order.id + '_row_' + idx;
                var isDone = !!checkedMap[rowKey];
                var badgeTag = persistentBadges[rowKey];

                return `
                  <div onclick="toggleItemReady(${order.id}, 'row_${idx}')" class="border-b border-slate-100 pb-1.5 cursor-pointer select-none transition ${isDone ? 'opacity-35' : 'hover:bg-slate-50'}">
                    <div class="flex items-center gap-2.5">
                      <div class="kot-check-box rounded-md flex items-center justify-center border shrink-0 transition ${isDone ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 bg-white'}">
                        ${isDone ? '✓' : ''}
                      </div>

                      <!-- BIGGER & BOLDER QUANTITY BADGE -->
                      <span class="kot-qty-badge font-black text-indigo-700 bg-indigo-50 border border-indigo-200/80 px-2 py-1 rounded-md shrink-0 shadow-2xs">
                        x${item.qty}
                      </span>

                      <span class="kot-item-title font-bold text-slate-800 flex-1 ${isDone ? 'line-through text-slate-400' : ''}">${item.name}</span>

                      ${badgeTag ? `
                        <span class="badge-alert kot-badge bg-rose-600 text-white font-black px-1.5 py-0.5 rounded uppercase tracking-wider shrink-0 shadow-2xs border border-rose-400">
                          ${badgeTag}
                        </span>
                      ` : ''}
                    </div>
                    ${item.notes ? `<div class="kot-notes text-amber-600 font-semibold mt-0.5 ml-8">↳ ${item.notes}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <!-- TWO-STAGE BUTTON FOOTER -->
            <div class="p-3 bg-slate-50 border-t border-slate-100">
              ${isReadyForDispatch ? `
                <button onclick="executeDispatch(${order.id})" class="kot-btn w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-black rounded-xl transition flex items-center justify-center gap-2 shadow-sm animate-bounce">
                  <span>🚀</span>
                  <span>Dispatch / Handover</span>
                </button>
              ` : `
                <button onclick="markReadyStage(${order.id})" class="kot-btn w-full ${allItemsReady ? 'bg-amber-500 hover:bg-amber-600 text-white' : 'bg-slate-200 hover:bg-emerald-600 text-slate-700 hover:text-white'} font-black rounded-xl transition flex items-center justify-center gap-1.5 shadow-2xs">
                  <span>✓</span>
                  <span>Mark Ready</span>
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');

      updateLiveTimers();
    }

    window.addEventListener('click', function() {
      if (isAudioAllowed) {
        unlockAudioEngine();
      }
    }, { once: true });

    initPersistentAudio();
    initCardScale();
    fetchKOT();
    setInterval(fetchKOT, 3500);
    setInterval(updateLiveTimers, 1000);
  </script>
</body>
</html>
