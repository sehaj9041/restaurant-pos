<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Kitchen Display (KOT)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .badge-alert {
      animation: pulse-ring 1.5s infinite;
    }
    input[type=range]::-webkit-slider-thumb {
      background: #ea580c;
      cursor: pointer;
    }

    /* DYNAMIC CARD SCALING & AUTO-FLOW GRID ENGINE */
    :root {
      --kot-scale: 1;
      --kot-card-min-width: 290px;
    }

    #kotGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--kot-card-min-width), 1fr));
      gap: calc(16px * var(--kot-scale));
      align-items: start;
    }

    .kot-card-box {
      font-size: calc(14px * var(--kot-scale));
    }
    .kot-card-box h3 {
      font-size: calc(20px * var(--kot-scale));
    }
    .kot-card-box .kot-item-title {
      font-size: calc(15px * var(--kot-scale));
    }
    .kot-card-box .kot-qty-badge {
      font-size: calc(18px * var(--kot-scale));
      line-height: 1;
    }
    .kot-card-box .kot-btn {
      font-size: calc(14px * var(--kot-scale));
      padding-top: calc(10px * var(--kot-scale));
      padding-bottom: calc(10px * var(--kot-scale));
    }
    .kot-card-box .kot-timer {
      font-size: calc(12px * var(--kot-scale));
    }
    .kot-card-box .kot-badge {
      font-size: calc(11px * var(--kot-scale));
    }
    .kot-card-box .kot-notes {
      font-size: calc(12px * var(--kot-scale));
    }
    .kot-card-box .kot-check-box {
      width: calc(22px * var(--kot-scale));
      height: calc(22px * var(--kot-scale));
    }
    .kot-card-box .kot-sub-check-box {
      width: calc(16px * var(--kot-scale));
      height: calc(16px * var(--kot-scale));
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans text-slate-800 select-none">

  <!-- TOP HEADER -->
  <div class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4 flex-wrap gap-4 bg-white p-4 rounded-2xl shadow-xs">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-wide text-slate-900">Live Kitchen Orders</h1>
    </div>
    
    <div class="flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg shadow-2xs">
        <span class="text-xs font-bold text-slate-600 flex items-center gap-1">
          <span>🔍</span> <span>Size:</span>
        </span>
        <input 
          type="range" 
          id="kotSizeSlider" 
          min="65" 
          max="140" 
          value="100" 
          step="5"
          oninput="changeKOTCardScale(this.value)"
          class="w-24 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-orange-500"
        />
        <span id="lblSizePercent" class="text-[11px] font-mono font-bold text-orange-600 w-9 text-right">100%</span>
        <button onclick="resetKOTCardScale()" title="Reset Size" class="text-slate-400 hover:text-slate-800 text-xs px-1 font-bold">↺</button>
      </div>

      <button onclick="openKdsSettingsModal()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-2xs">
        <span>🖨</span> <span id="lblPrinterStatus">Printer: OFF</span>
      </button>

      <button id="btnFullScreen" onclick="toggleFullScreen()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-2xs">
        <span id="fullScreenIcon">⛶</span> <span id="fullScreenText">Fullscreen</span>
      </button>

      <button id="btnAudioToggle" onclick="toggleAudioSetting()" class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-2xs">
        <span>🔔</span> <span id="lblAudioStatus">Sound Alert Active</span>
      </button>

      <span id="pendingCount" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm shadow-2xs">0 Pending</span>
      <a href="/" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-2xs">
        ← POS Counter
      </a>
    </div>
  </div>

  <div id="kotGrid">
    <div class="col-span-full text-center py-24 text-slate-400 font-bold text-lg">No active orders right now.</div>
  </div>

  <div id="tvStatusBanner" style="position: fixed; bottom: 20px; right: 20px; z-index: 99999; padding: 15px 25px; border-radius: 12px; font-size: 18px; font-weight: bold; color: white; background: rgba(0,0,0,0.85); display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
  </div>

  <div id="kdsSettingsModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-black text-slate-900 text-sm">KDS Network Printer Setup</h3>
        <button onclick="closeKdsSettingsModal()" class="text-slate-400 hover:text-black font-bold text-base">✕</button>
      </div>
      
      <div class="space-y-3">
        <label class="flex items-center justify-between p-3 bg-slate-50 border rounded-xl cursor-pointer">
          <div>
            <div class="font-black text-slate-800">Enable Token Auto-Print</div>
            <div class="text-[10px] text-slate-500">Isi KDS se item ready hone par print nikle</div>
          </div>
          <input type="checkbox" id="kdsAutoPrintToggle" onchange="toggleKdsPrinterFields()" class="w-4 h-4 accent-orange-500 rounded">
        </label>

        <div id="printerIpSection" class="space-y-1 hidden">
          <label class="block font-bold text-slate-600 uppercase text-[10px]">Printer IP Address</label>
          <input type="text" id="kdsPrinterIp" placeholder="e.g. 192.168.1.88" class="w-full border border-slate-300 rounded-lg p-2 font-mono font-bold text-slate-800 outline-none focus:border-orange-500">
          <p class="text-[10px] text-slate-400">Thermal printer ka local Wi-Fi IP address daalein</p>
        </div>
      </div>

      <div class="pt-2 flex justify-end gap-2">
        <button onclick="closeKdsSettingsModal()" class="border px-3 py-2 rounded-xl font-bold bg-white">Cancel</button>
        <button onclick="saveKdsPrinterSetting()" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-xl font-bold">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    var audioCtx = null;
    var isAudioAllowed = true;
    var liveOrdersData = [];

    function showTvStatus(message, isError = false) {
      var banner = document.getElementById('tvStatusBanner');
      if (!banner) return;
      banner.innerText = message;
      banner.style.backgroundColor = isError ? '#e74c3c' : '#2ecc71';
      banner.style.display = 'block';
      setTimeout(function() { banner.style.display = 'none'; }, 4000);
    }

    function getKdsPrinterConfig() {
      try {
        return JSON.parse(localStorage.getItem('kds_device_printer_config') || '{"enabled": false, "ip": ""}');
      } catch(e) {
        return { enabled: false, ip: "" };
      }
    }

    function openKdsSettingsModal() {
      var cfg = getKdsPrinterConfig();
      document.getElementById('kdsAutoPrintToggle').checked = !!cfg.enabled;
      document.getElementById('kdsPrinterIp').value = cfg.ip || '';
      toggleKdsPrinterFields();
      document.getElementById('kdsSettingsModal').classList.remove('hidden');
    }

    function closeKdsSettingsModal() {
      document.getElementById('kdsSettingsModal').classList.add('hidden');
      updateKdsPrinterUIState();
    }

    function toggleKdsPrinterFields() {
      var isChecked = document.getElementById('kdsAutoPrintToggle').checked;
      var ipSec = document.getElementById('printerIpSection');
      if (isChecked) { ipSec.classList.remove('hidden'); } else { ipSec.classList.add('hidden'); }
    }

    function saveKdsPrinterSetting() {
      var isEnabled = document.getElementById('kdsAutoPrintToggle').checked;
      var ipVal = document.getElementById('kdsPrinterIp').value.trim();
      localStorage.setItem('kds_device_printer_config', JSON.stringify({ enabled: isEnabled, ip: ipVal }));
      closeKdsSettingsModal();
      updateKdsPrinterUIState();
      alert('Printer settings saved successfully for this KDS!');
    }

    function updateKdsPrinterUIState() {
      var cfg = getKdsPrinterConfig();
      var btnLbl = document.getElementById('lblPrinterStatus');
      if (btnLbl) {
        btnLbl.innerText = (cfg.enabled && cfg.ip) ? `Printer: ON (${cfg.ip})` : "Printer: OFF";
      }
    }

    function printItemReadyToken(order, item) {
      var printerCfg = getKdsPrinterConfig();
      if (!printerCfg.enabled || !printerCfg.ip) return;
      var cleanName = item.name.replace(/\s*\(.*?\)\s*$/, '').trim();
      var addonsStr = '';
      if (item.addons && Array.isArray(item.addons)) {
        addonsStr = item.addons.map(a => a.name).join(', ');
      } else if (item.notes) {
