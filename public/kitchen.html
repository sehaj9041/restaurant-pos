<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Kitchen Display (KOT)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .badge-alert {
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen p-6 font-sans text-white select-none">

  <!-- TOP HEADER -->
  <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-wide">Live Kitchen Orders</h1>
    </div>
    <div class="flex items-center gap-3">
      <!-- FULLSCREEN TOGGLE BUTTON -->
      <button id="btnFullScreen" onclick="toggleFullScreen()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm">
        <span id="fullScreenIcon">⛶</span> <span id="fullScreenText">Fullscreen</span>
      </button>

      <!-- AUDIO ALERT TOGGLE -->
      <button id="btnAudioToggle" onclick="enableAudioContext()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm">
        <span>🔔</span> <span id="lblAudioStatus">Enable Sound Alert</span>
      </button>

      <span id="pendingCount" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm">0 Pending</span>
      <a href="/" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition">
        ← POS Counter
      </a>
    </div>
  </div>

  <!-- KOT GRID: items-start added so cards only take their natural height -->
  <div id="kotGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 items-start">
    <div class="col-span-full text-center py-20 text-gray-500 font-bold">No active orders right now.</div>
  </div>

  <script>
    var audioCtx = null;
    var isAudioAllowed = false;
    var liveOrdersData = [];

    // ================= FULLSCREEN TOGGLE LOGIC =================
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(err) {
          console.warn("Fullscreen error:", err.message);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', function() {
      var icon = document.getElementById('fullScreenIcon');
      var txt = document.getElementById('fullScreenText');
      if (document.fullscreenElement) {
        icon.innerText = "⛷";
        txt.innerText = "Exit Fullscreen";
      } else {
        icon.innerText = "⛶";
        txt.innerText = "Fullscreen";
      }
    });

    // ================= LOCAL STORAGE PERSISTENCE =================
    function getStoredSnapshots() {
      try {
        return JSON.parse(localStorage.getItem('kot_order_snapshots') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStoredSnapshots(snapshots) {
      localStorage.setItem('kot_order_snapshots', JSON.stringify(snapshots));
    }

    function getCheckedItemKeys() {
      try {
        return JSON.parse(localStorage.getItem('kot_checked_items') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveCheckedItemKeys(store) {
      localStorage.setItem('kot_checked_items', JSON.stringify(store));
    }

    function getAlertBadges() {
      try {
        return JSON.parse(localStorage.getItem('kot_alert_badges') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveAlertBadges(badges) {
      localStorage.setItem('kot_alert_badges', JSON.stringify(badges));
    }

    function getReadyForDispatchOrders() {
      try {
        return JSON.parse(localStorage.getItem('kot_ready_dispatch') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveReadyForDispatchOrders(store) {
      localStorage.setItem('kot_ready_dispatch', JSON.stringify(store));
    }

    // ================= AUDIO CHIME LOGIC =================
    function enableAudioContext() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        isAudioAllowed = true;
        var btn = document.getElementById('btnAudioToggle');
        var lbl = document.getElementById('lblAudioStatus');
        btn.className = "bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm cursor-default";
        lbl.innerText = "Sound Alert Active";
        playKOTBeepSound();
      } catch (e) {
        console.error('Audio init error:', e);
      }
    }

    function playKOTBeepSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        var now = audioCtx.currentTime;
        
        var osc1 = audioCtx.createOscillator();
        var gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        var osc2 = audioCtx.createOscillator();
        var gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1318.51, now + 0.12);
        gain2.gain.setValueAtTime(0.45, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.65);
      } catch (err) {
        console.warn('Audio awaiting interaction:', err);
      }
    }

    function toggleItemReady(orderId, rowIdentifier) {
      var store = getCheckedItemKeys();
      var key = orderId + '_' + rowIdentifier;
      store[key] = !store[key];
      saveCheckedItemKeys(store);
      renderKOTCards();
    }

    function markReadyStage(id) {
      var strId = id.toString();
      var readyStore = getReadyForDispatchOrders();
      readyStore[strId] = true;
      saveReadyForDispatchOrders(readyStore);

      var checkedMap = getCheckedItemKeys();
      var targetOrder = liveOrdersData.find(function(o){ return o.id.toString() === strId; });
      if (targetOrder) {
        (targetOrder.items || []).forEach(function(item, idx) {
          checkedMap[strId + '_row_' + idx] = true;
        });
        saveCheckedItemKeys(checkedMap);
      }

      renderKOTCards();
    }

    function undoReadyStage(id) {
      var strId = id.toString();
      var readyStore = getReadyForDispatchOrders();
      delete readyStore[strId];
      saveReadyForDispatchOrders(readyStore);
      renderKOTCards();
    }

    function executeDispatch(id) {
      var strId = id.toString();
      var snapshots = getStoredSnapshots();
      var checkedMap = getCheckedItemKeys();
      var readyStore = getReadyForDispatchOrders();

      if (snapshots[strId]) {
        snapshots[strId].wasCompletedBefore = true;
        var rCount = snapshots[strId].rowsCount || 0;
        for (var i = 0; i < rCount; i++) {
          checkedMap[strId + '_row_' + i] = true;
        }
      }

      var badges = getAlertBadges();
      Object.keys(badges).forEach(function(k) {
        if (k.startsWith(strId + '_')) delete badges[k];
      });

      delete readyStore[strId];

      saveStoredSnapshots(snapshots);
      saveCheckedItemKeys(checkedMap);
      saveAlertBadges(badges);
      saveReadyForDispatchOrders(readyStore);

      fetch('/api/kot/' + id + '/complete', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() { fetchKOT(); });
    }

    function updateLiveTimers() {
      var now = Date.now();
      liveOrdersData.forEach(function(order) {
        var timerEl = document.getElementById('kotTimer_' + order.id);
        if (!timerEl) return;

        var startTime = order.created_at ? new Date(order.created_at).getTime() : now;
        var diffSec = Math.max(0, Math.floor((now - startTime) / 1000));

        var mins = Math.floor(diffSec / 60);
        var secs = diffSec % 60;
        var formatted = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;

        timerEl.innerText = formatted;

        if (mins >= 10) {
          timerEl.className = "text-rose-400 font-mono font-black text-xs bg-rose-950/80 px-2 py-0.5 rounded border border-rose-700/60 animate-pulse";
        } else if (mins >= 5) {
          timerEl.className = "text-amber-300 font-mono font-black text-xs bg-amber-950/80 px-2 py-0.5 rounded border border-amber-700/60";
        } else {
          timerEl.className = "text-gray-300 font-mono font-bold text-xs bg-gray-900/80 px-2 py-0.5 rounded border border-gray-700/60";
        }
      });
    }

    function fetchKOT() {
      fetch('/api/kot')
        .then(function(res) { return res.json(); })
        .then(function(orders) {
          liveOrdersData = orders || [];
          document.getElementById('pendingCount').innerText = liveOrdersData.length + ' Pending';

          var snapshots = getStoredSnapshots();
          var persistentBadges = getAlertBadges();
          var checkedMap = getCheckedItemKeys();
          var readyStore = getReadyForDispatchOrders();
          var shouldPlaySound = false;

          liveOrdersData.forEach(function(order) {
            var orderId = order.id.toString();
            var prevSnapshot = snapshots[orderId];
            var currentItems = order.items || [];

            if (!prevSnapshot) {
              shouldPlaySound = true;
              snapshots[orderId] = {
                rowsCount: currentItems.length,
                rowsQty: currentItems.map(function(i){ return Number(i.qty) || 1; }),
                wasCompletedBefore: false
              };
            } else {
              var prevRowsCount = prevSnapshot.rowsCount || 0;
              var prevRowsQty = prevSnapshot.rowsQty || [];

              if (currentItems.length > prevRowsCount) {
                shouldPlaySound = true;
                delete readyStore[orderId];
                for (var idx = prevRowsCount; idx < currentItems.length; idx++) {
                  var itemRowKey = orderId + '_row_' + idx;
                  persistentBadges[itemRowKey] = 'NEW';
                  delete checkedMap[itemRowKey];
                }
              }

              currentItems.forEach(function(item, idx) {
                var currentQty = Number(item.qty) || 1;
                var prevQty = prevRowsQty[idx];

                if (prevQty !== undefined && currentQty > prevQty) {
                  var diff = currentQty - prevQty;
                  var rowKey = orderId + '_row_' + idx;
                  persistentBadges[rowKey] = '+' + diff + ' QTY';
                  delete checkedMap[rowKey];
                  delete readyStore[orderId];
                  shouldPlaySound = true;
                }
              });

              if (prevSnapshot.wasCompletedBefore && (currentItems.length > prevRowsCount || shouldPlaySound)) {
                for (var p = 0; p < prevRowsCount; p++) {
                  var rKey = orderId + '_row_' + p;
                  if (!persistentBadges[rKey]) {
                    checkedMap[rKey] = true;
                  }
                }
                prevSnapshot.wasCompletedBefore = false;
              }

              snapshots[orderId].rowsCount = currentItems.length;
              snapshots[orderId].rowsQty = currentItems.map(function(i){ return Number(i.qty) || 1; });
            }
          });

          var currentOrderIds = new Set(liveOrdersData.map(function(o){ return o.id.toString(); }));
          Object.keys(snapshots).forEach(function(id) {
            if (!currentOrderIds.has(id)) delete snapshots[id];
          });
          Object.keys(persistentBadges).forEach(function(key) {
            var ordId = key.split('_')[0];
            if (!currentOrderIds.has(ordId)) delete persistentBadges[key];
          });
          Object.keys(readyStore).forEach(function(id) {
            if (!currentOrderIds.has(id)) delete readyStore[id];
          });

          saveStoredSnapshots(snapshots);
          saveAlertBadges(persistentBadges);
          saveCheckedItemKeys(checkedMap);
          saveReadyForDispatchOrders(readyStore);

          if (shouldPlaySound) {
            playKOTBeepSound();
          }

          renderKOTCards();
        })
        .catch(function(){});
    }

    function renderKOTCards() {
      var grid = document.getElementById('kotGrid');
      if (!liveOrdersData || liveOrdersData.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 font-bold text-lg">No active orders in kitchen right now.</div>';
        return;
      }

      var persistentBadges = getAlertBadges();
      var checkedMap = getCheckedItemKeys();
      var readyStore = getReadyForDispatchOrders();

      grid.innerHTML = liveOrdersData.map(function(order) {
        var strId = order.id.toString();
        var isReadyForDispatch = !!readyStore[strId];

        var allItemsReady = (order.items || []).every(function(item, idx) {
          return !!checkedMap[order.id + '_row_' + idx];
        });

        var theme = {
          border: 'border-blue-500/30',
          badgeBg: 'bg-blue-950/80 text-blue-300 border-blue-600/50',
          headerBg: 'bg-blue-950/30',
          emoji: '🪑🍽️',
          label: 'Dine-In'
        };

        if (order.order_type === 'Takeaway') {
          theme = {
            border: 'border-emerald-500/30',
            badgeBg: 'bg-emerald-950/80 text-emerald-300 border-emerald-600/50',
            headerBg: 'bg-emerald-950/30',
            emoji: '🛍️',
            label: 'Takeaway'
          };
        } else if (order.order_type === 'Delivery') {
          theme = {
            border: 'border-purple-500/30',
            badgeBg: 'bg-purple-950/80 text-purple-300 border-purple-600/50',
            headerBg: 'bg-purple-950/30',
            emoji: '🛵',
            label: 'Delivery'
          };
        }

        var cardBorderClass = isReadyForDispatch 
          ? 'border-emerald-400 bg-emerald-950/20 shadow-emerald-900/50 ring-2 ring-emerald-500/50' 
          : (allItemsReady ? 'border-emerald-500/80' : theme.border);

        return `
          <!-- COMPACT CARD: Only occupies required height -->
          <div class="bg-gray-800 border-2 ${cardBorderClass} rounded-2xl flex flex-col justify-between overflow-hidden shadow-xl transition self-start w-full">
            <!-- HEADER -->
            <div class="p-3.5 border-b border-gray-700/80 ${theme.headerBg} flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-xl font-black text-white">#${order.id}</h3>
                  <span class="text-xs font-black px-2 py-0.5 rounded-md border ${theme.badgeBg} flex items-center gap-1">
                    <span>${theme.emoji}</span>
                    <span>${theme.label}</span>
                    ${order.table_no ? `<span>• ${order.table_no}</span>` : ''}
                  </span>
                </div>
                <div class="text-[10px] text-gray-400 font-mono mt-0.5">Order Time: ${order.time || ''}</div>
              </div>

              <!-- LIVE 00:00 TIMER -->
              <div class="flex flex-col items-end">
                <span class="text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-0.5">Elapsed</span>
                <span id="kotTimer_${order.id}" class="text-gray-300 font-mono font-bold text-xs bg-gray-900/80 px-2 py-0.5 rounded border border-gray-700/60">
                  00:00
                </span>
              </div>
            </div>

            <!-- READY STATUS BANNER -->
            ${isReadyForDispatch ? `
              <div class="bg-emerald-600/30 border-b border-emerald-500/40 px-3 py-1.5 flex justify-between items-center">
                <span class="text-xs font-black text-emerald-300 flex items-center gap-1.5">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  READY FOR PICKUP
                </span>
                <button onclick="undoReadyStage(${order.id})" class="text-[10px] font-bold text-gray-400 hover:text-white underline">
                  Undo
                </button>
              </div>
            ` : ''}

            <!-- ITEMS LIST (COMPACT, NO FORCED MIN-HEIGHT) -->
            <div class="p-3.5 space-y-2">
              ${(order.items || []).map(function(item, idx) {
                var rowKey = order.id + '_row_' + idx;
                var isDone = !!checkedMap[rowKey];
                var badgeTag = persistentBadges[rowKey];

                return `
                  <div onclick="toggleItemReady(${order.id}, 'row_${idx}')" class="border-b border-gray-700/50 pb-1.5 cursor-pointer select-none transition ${isDone ? 'opacity-35' : 'hover:bg-gray-750'}">
                    <div class="flex items-center gap-2 text-sm">
                      <div class="w-5 h-5 rounded-md flex items-center justify-center border shrink-0 transition ${isDone ? 'bg-emerald-600 border-emerald-500 text-white' : 'border-gray-500 bg-gray-900'}">
                        ${isDone ? '✓' : ''}
                      </div>

                      <span class="bg-indigo-900/80 text-indigo-200 font-black px-2 py-0.5 rounded text-xs shrink-0">x${item.qty}</span>

                      <span class="font-bold text-gray-200 flex-1 ${isDone ? 'line-through text-gray-400' : ''}">${item.name}</span>

                      ${badgeTag ? `
                        <span class="badge-alert bg-rose-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider shrink-0 shadow-xs border border-rose-400">
                          ${badgeTag}
                        </span>
                      ` : ''}
                    </div>
                    ${item.notes ? `<div class="text-xs text-amber-400 font-semibold mt-0.5 ml-7">↳ ${item.notes}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <!-- TWO-STAGE BUTTON FOOTER -->
            <div class="p-3 bg-gray-850 border-t border-gray-700/80">
              ${isReadyForDispatch ? `
                <button onclick="executeDispatch(${order.id})" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/60 animate-bounce">
                  <span>🚀</span>
                  <span>Dispatch / Handover</span>
                </button>
              ` : `
                <button onclick="markReadyStage(${order.id})" class="w-full ${allItemsReady ? 'bg-amber-600 hover:bg-amber-500' : 'bg-gray-700 hover:bg-emerald-600'} text-white font-black py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-1.5 shadow-md">
                  <span>✓</span>
                  <span>Mark Ready</span>
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');

      updateLiveTimers();
    }

    window.addEventListener('click', function() {
      if (!isAudioAllowed) {
        enableAudioContext();
      }
    }, { once: true });

    fetchKOT();
    setInterval(fetchKOT, 3500);
    setInterval(updateLiveTimers, 1000);
  </script>
</body>
</html>
