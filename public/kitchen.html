<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Kitchen Display (KOT)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-6 font-sans text-white">

  <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-wide">Live Kitchen Orders</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="pendingCount" class="bg-indigo-600 text-white font-bold px-3 py-1 rounded-lg text-sm">0 Pending</span>
      <a href="/" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition">
        ← POS Counter
      </a>
    </div>
  </div>

  <div id="kotGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div class="col-span-full text-center py-20 text-gray-500 font-bold">No active orders right now.</div>
  </div>

  <script>
    function loadKOT() {
      fetch('/api/kot')
        .then(res => res.json())
        .then(orders => {
          document.getElementById('pendingCount').innerText = orders.length + ' Pending';
          const grid = document.getElementById('kotGrid');

          if (orders.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 font-bold text-lg">No active orders in kitchen right now.</div>';
            return;
          }

          grid.innerHTML = orders.map(order => `
            <div class="bg-gray-800 border border-gray-700 rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg">
              <div class="p-4 border-b border-gray-700 bg-gray-850 flex justify-between items-center">
                <div>
                  <h3 class="text-xl font-black text-white">Order #${order.id}</h3>
                  <span class="text-xs text-indigo-400 font-bold">${order.order_type} ${order.table_no ? '(' + order.table_no + ')' : ''}</span>
                </div>
                <span class="text-xs text-gray-400 font-mono">${order.time}</span>
              </div>

              <div class="p-4 flex-1 space-y-2.5">
                ${order.items.map(item => `
                  <div class="border-b border-gray-700/50 pb-2">
                    <div class="flex justify-between items-center text-sm">
                      <span class="font-bold text-gray-200">${item.name}</span>
                      <span class="bg-indigo-900/60 text-indigo-300 font-black px-2 py-0.5 rounded text-xs">x${item.qty}</span>
                    </div>
                    ${item.notes ? `<div class="text-xs text-amber-400 font-semibold mt-0.5">↳ ${item.notes}</div>` : ''}
                  </div>
                `).join('')}
              </div>

              <div class="p-3 bg-gray-850 border-t border-gray-700">
                <button onclick="markDone(${order.id})" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-xl transition text-sm">
                  ✓ Ready / Done
                </button>
              </div>
            </div>
          `).join('');
        });
    }

    function markDone(id) {
      fetch('/api/kot/' + id + '/complete', { method: 'POST' })
        .then(res => res.json())
        .then(() => loadKOT());
    }

    loadKOT();
    setInterval(loadKOT, 5000);
  </script>
</body>
</html>
