<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Kitchen Display (KOT)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen p-6 font-sans text-white">

  <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-wide">Live Kitchen Orders</h1>
    </div>
    <div class="flex items-center gap-4">
      <span id="pendingCount" class="bg-indigo-600 text-white font-bold px-3 py-1 rounded-lg text-sm">0 Pending</span>
      <a href="/" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition">
        ← POS Counter
      </a>
    </div>
  </div>

  <div id="kotGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div class="col-span-full text-center py-20 text-gray-500 font-bold">No active orders right now.</div>
  </div>

  <script>
    // Item tick status persist rakhne ke liye helper
    function getCheckedItemKeys() {
      try {
        return JSON.parse(localStorage.getItem('kot_checked_items') || '{}');
      } catch (e) {
        return {};
      }
    }

    function toggleItemReady(orderId, itemIndex) {
      var store = getCheckedItemKeys();
      var key = orderId + '_' + itemIndex;
      store[key] = !store[key];
      localStorage.setItem('kot_checked_items', JSON.stringify(store));
      loadKOT();
    }

    function loadKOT() {
      fetch('/api/kot')
        .then(function(res) { return res.json(); })
        .then(function(orders) {
          document.getElementById('pendingCount').innerText = orders.length + ' Pending';
          var grid = document.getElementById('kotGrid');

          if (!orders || orders.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 font-bold text-lg">No active orders in kitchen right now.</div>';
            return;
          }

          var checkedMap = getCheckedItemKeys();

          grid.innerHTML = orders.map(function(order) {
            return `
              <div class="bg-gray-800 border border-gray-700 rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg">
                <div class="p-4 border-b border-gray-700 bg-gray-850 flex justify-between items-center">
                  <div>
                    <h3 class="text-xl font-black text-white">Order #${order.id}</h3>
                    <span class="text-xs text-indigo-400 font-bold">${order.order_type} ${order.table_no ? '(' + order.table_no + ')' : ''}</span>
                  </div>
                  <span class="text-xs text-gray-400 font-mono">${order.time || ''}</span>
                </div>

                <div class="p-4 flex-1 space-y-2.5">
                  ${(order.items || []).map(function(item, idx) {
                    var isDone = !!checkedMap[order.id + '_' + idx];
                    return `
                      <div onclick="toggleItemReady(${order.id},${idx})" class="border-b border-gray-700/50 pb-2 cursor-pointer select-none transition ${isDone ? 'opacity-40' : 'hover:bg-gray-750'}">
                        <div class="flex items-center gap-2.5 text-sm">
                          <!-- TICK MARK BOX -->
                          <div class="w-5 h-5 rounded-md flex items-center justify-center border transition ${isDone ? 'bg-emerald-600 border-emerald-500 text-white' : 'border-gray-500 bg-gray-900'}">
                            ${isDone ? '✓' : ''}
                          </div>

                          <!-- QUANTITY AAGE -->
                          <span class="bg-indigo-900/80 text-indigo-200 font-black px-2 py-0.5 rounded text-xs">x${item.qty}</span>

                          <!-- ITEM NAME -->
                          <span class="font-bold text-gray-200 ${isDone ? 'line-through text-gray-400' : ''}">${item.name}</span>
                        </div>
                        ${item.notes ? `<div class="text-xs text-amber-400 font-semibold mt-0.5 ml-7">↳ ${item.notes}</div>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="p-3 bg-gray-850 border-t border-gray-700">
                  <button onclick="markDone(${order.id})" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-1.5 shadow-md">
                    <span>✓ Ready / Done</span>
                  </button>
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(function(){});
    }

    function markDone(id) {
      // Order complete hone par uske individual ticks clean karna
      var store = getCheckedItemKeys();
      Object.keys(store).forEach(function(k) {
        if (k.startsWith(id + '_')) delete store[k];
      });
      localStorage.setItem('kot_checked_items', JSON.stringify(store));

      fetch('/api/kot/' + id + '/complete', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() { loadKOT(); });
    }

    loadKOT();
    setInterval(loadKOT, 5000);
  </script>
</body>
</html>
