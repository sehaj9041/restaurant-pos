<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Kitchen Display (KOT)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .badge-alert {
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen p-6 font-sans text-white select-none">

  <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
    <div class="flex items-center gap-3">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <h1 class="text-2xl font-black tracking-wide">Live Kitchen Orders</h1>
    </div>
    <div class="flex items-center gap-3">
      <button id="btnAudioToggle" onclick="enableAudioContext()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm">
        <span>🔔</span> <span id="lblAudioStatus">Enable Sound Alert</span>
      </button>

      <span id="pendingCount" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-sm">0 Pending</span>
      <a href="/" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition">
        ← POS Counter
      </a>
    </div>
  </div>

  <div id="kotGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div class="col-span-full text-center py-20 text-gray-500 font-bold">No active orders right now.</div>
  </div>

  <script>
    var audioCtx = null;
    var isAudioAllowed = false;

    function getStoredSnapshots() {
      try {
        return JSON.parse(localStorage.getItem('kot_order_snapshots') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveStoredSnapshots(snapshots) {
      localStorage.setItem('kot_order_snapshots', JSON.stringify(snapshots));
    }

    function getCheckedItemKeys() {
      try {
        return JSON.parse(localStorage.getItem('kot_checked_items') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveCheckedItemKeys(store) {
      localStorage.setItem('kot_checked_items', JSON.stringify(store));
    }

    function getAlertBadges() {
      try {
        return JSON.parse(localStorage.getItem('kot_alert_badges') || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveAlertBadges(badges) {
      localStorage.setItem('kot_alert_badges', JSON.stringify(badges));
    }

    function enableAudioContext() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        isAudioAllowed = true;
        var btn = document.getElementById('btnAudioToggle');
        var lbl = document.getElementById('lblAudioStatus');
        btn.className = "bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-sm cursor-default";
        lbl.innerText = "Sound Alert Active";
        playKOTBeepSound();
      } catch (e) {
        console.error('Audio init error:', e);
      }
    }

    function playKOTBeepSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        var now = audioCtx.currentTime;
        
        var osc1 = audioCtx.createOscillator();
        var gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        var osc2 = audioCtx.createOscillator();
        var gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1318.51, now + 0.12);
        gain2.gain.setValueAtTime(0.45, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.65);
      } catch (err) {
        console.warn('Audio awaiting interaction:', err);
      }
    }

    function toggleItemReady(orderId, rowIdentifier) {
      var store = getCheckedItemKeys();
      var key = orderId + '_' + rowIdentifier;
      store[key] = !store[key];
      saveCheckedItemKeys(store);
      loadKOT();
    }

    function loadKOT() {
      fetch('/api/kot')
        .then(function(res) { return res.json(); })
        .then(function(orders) {
          document.getElementById('pendingCount').innerText = (orders ? orders.length : 0) + ' Pending';
          var grid = document.getElementById('kotGrid');

          if (!orders || orders.length === 0) {
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 font-bold text-lg">No active orders in kitchen right now.</div>';
            return;
          }

          var snapshots = getStoredSnapshots();
          var persistentBadges = getAlertBadges();
          var checkedMap = getCheckedItemKeys();
          var shouldPlaySound = false;

          orders.forEach(function(order) {
            var orderId = order.id.toString();
            var prevSnapshot = snapshots[orderId];
            var currentItems = order.items || [];

            if (!prevSnapshot) {
              // Brand new order in KDS
              shouldPlaySound = true;
              snapshots[orderId] = {
                rowsCount: currentItems.length,
                wasCompletedBefore: false
              };
            } else {
              // Existing order: Agar naye rows add hue hain
              var prevRowsCount = prevSnapshot.rowsCount || 0;

              if (currentItems.length > prevRowsCount) {
                shouldPlaySound = true;
                for (var idx = prevRowsCount; idx < currentItems.length; idx++) {
                  var itemRowKey = orderId + '_row_' + idx;
                  persistentBadges[itemRowKey] = 'NEW';
                  delete checkedMap[itemRowKey]; // Uncheck new row
                }
              }

              // Agar pehle order complete mark ho chuka tha aur ab naya row aaya hai
              if (prevSnapshot.wasCompletedBefore && currentItems.length > prevRowsCount) {
                // Purani saari rows ko checked hi rakho
                for (var p = 0; p < prevRowsCount; p++) {
                  checkedMap[orderId + '_row_' + p] = true;
                }
                prevSnapshot.wasCompletedBefore = false;
              }

              snapshots[orderId].rowsCount = currentItems.length;
            }
          });

          // Clean up completed orders
          var currentOrderIds = new Set(orders.map(function(o){ return o.id.toString(); }));
          Object.keys(snapshots).forEach(function(id) {
            if (!currentOrderIds.has(id)) delete snapshots[id];
          });
          Object.keys(persistentBadges).forEach(function(key) {
            var ordId = key.split('_')[0];
            if (!currentOrderIds.has(ordId)) delete persistentBadges[key];
          });

          saveStoredSnapshots(snapshots);
          saveAlertBadges(persistentBadges);
          saveCheckedItemKeys(checkedMap);

          if (shouldPlaySound) {
            playKOTBeepSound();
          }

          // Render Grid
          grid.innerHTML = orders.map(function(order) {
            var allItemsReady = (order.items || []).every(function(item, idx) {
              return !!checkedMap[order.id + '_row_' + idx];
            });

            return `
              <div class="bg-gray-800 border ${allItemsReady ? 'border-emerald-600/80 bg-gray-800/80' : 'border-gray-700'} rounded-2xl flex flex-col justify-between overflow-hidden shadow-lg transition">
                <div class="p-4 border-b border-gray-700 bg-gray-850 flex justify-between items-center">
                  <div>
                    <h3 class="text-xl font-black text-white">Order #${order.id}</h3>
                    <span class="text-xs text-indigo-400 font-bold">${order.order_type} ${order.table_no ? '(' + order.table_no + ')' : ''}</span>
                  </div>
                  <span class="text-xs text-gray-400 font-mono">${order.time || ''}</span>
                </div>

                <div class="p-4 flex-1 space-y-2.5">
                  ${(order.items || []).map(function(item, idx) {
                    var rowKey = order.id + '_row_' + idx;
                    var isDone = !!checkedMap[rowKey];
                    var badgeTag = persistentBadges[rowKey];

                    return `
                      <div onclick="toggleItemReady(${order.id}, 'row_${idx}')" class="border-b border-gray-700/50 pb-2 cursor-pointer select-none transition ${isDone ? 'opacity-40' : 'hover:bg-gray-750'}">
                        <div class="flex items-center gap-2 text-sm">
                          <!-- TICK MARK BOX -->
                          <div class="w-5 h-5 rounded-md flex items-center justify-center border shrink-0 transition ${isDone ? 'bg-emerald-600 border-emerald-500 text-white' : 'border-gray-500 bg-gray-900'}">
                            ${isDone ? '✓' : ''}
                          </div>

                          <!-- QUANTITY AAGE -->
                          <span class="bg-indigo-900/80 text-indigo-200 font-black px-2 py-0.5 rounded text-xs shrink-0">x${item.qty}</span>

                          <!-- ITEM NAME -->
                          <span class="font-bold text-gray-200 flex-1 ${isDone ? 'line-through text-gray-400' : ''}">${item.name}</span>

                          <!-- PERSISTENT NEW BADGE -->
                          ${badgeTag ? `
                            <span class="badge-alert bg-rose-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider shrink-0 shadow-xs border border-rose-400">
                              ${badgeTag}
                            </span>
                          ` : ''}
                        </div>
                        ${item.notes ? `<div class="text-xs text-amber-400 font-semibold mt-0.5 ml-7">↳ ${item.notes}</div>` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>

                <div class="p-3 bg-gray-850 border-t border-gray-700">
                  <button onclick="markDone(${order.id})" class="w-full ${allItemsReady ? 'bg-emerald-600 hover:bg-emerald-500 animate-pulse' : 'bg-gray-700 hover:bg-emerald-600'} text-white font-black py-2.5 rounded-xl transition text-sm flex items-center justify-center gap-1.5 shadow-md">
                    <span>✓ Ready / Done</span>
                  </button>
                </div>
              </div>
            `;
          }).join('');
        })
        .catch(function(){});
    }

    function markDone(id) {
      var strId = id.toString();
      var snapshots = getStoredSnapshots();
      var checkedMap = getCheckedItemKeys();

      // Saare current items ko ready mark kar do
      if (snapshots[strId]) {
        snapshots[strId].wasCompletedBefore = true;
        var rCount = snapshots[strId].rowsCount || 0;
        for (var i = 0; i < rCount; i++) {
          checkedMap[strId + '_row_' + i] = true;
        }
      }

      // Clear badges
      var badges = getAlertBadges();
      Object.keys(badges).forEach(function(k) {
        if (k.startsWith(strId + '_')) delete badges[k];
      });

      saveStoredSnapshots(snapshots);
      saveCheckedItemKeys(checkedMap);
      saveAlertBadges(badges);

      fetch('/api/kot/' + id + '/complete', { method: 'POST' })
        .then(function(res) { return res.json(); })
        .then(function() { loadKOT(); });
    }

    window.addEventListener('click', function() {
      if (!isAudioAllowed) {
        enableAudioContext();
      }
    }, { once: true });

    loadKOT();
    setInterval(loadKOT, 3500);
  </script>
</body>
</html>
