<script>
    let currentReport = { summary: {}, topItems: [], orders: [], range: {} };

    function setDatePreset(type) {
      const today = new Date().toISOString().slice(0, 10);
      ['Today', 'Yesterday', '7Days', 'Month'].forEach(p => {
        const btn = document.getElementById('btnPreset' + p);
        if (p.toLowerCase() === type.toLowerCase()) {
          btn.className = "px-3 py-1.5 rounded-xl text-xs font-black bg-indigo-600 text-white transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-xl text-xs font-bold text-gray-600 hover:bg-gray-100 transition";
        }
      });

      if (type === 'today') {
        document.getElementById('filterStartDate').value = today;
        document.getElementById('filterEndDate').value = today;
      } else if (type === 'yesterday') {
        const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        document.getElementById('filterStartDate').value = yest;
        document.getElementById('filterEndDate').value = yest;
      } else if (type === '7days') {
        const past = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
        document.getElementById('filterStartDate').value = past;
        document.getElementById('filterEndDate').value = today;
      } else if (type === 'month') {
        const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10);
        document.getElementById('filterStartDate').value = firstDay;
        document.getElementById('filterEndDate').value = today;
      }

      loadReportData();
    }

    function loadReportData() {
      const s = document.getElementById('filterStartDate').value;
      const e = document.getElementById('filterEndDate').value;

      fetch(`/api/reports/analytics?startDate=${s}&endDate=${e}`)
        .then(res => res.json())
        .then(data => {
          currentReport = data;
          renderMetrics(data.summary);
          renderTopItems(data.topItems);
          renderOrdersLog(data.orders);
        });

      loadTodayExpenses();
    }

    function renderMetrics(summary) {
      document.getElementById('kpiGrossTurnover').innerText = '₹' + summary.total_sales;
      document.getElementById('kpiOrderCount').innerText = `${summary.total_orders} Orders Settled`;
      document.getElementById('kpiCashSales').innerText = '₹' + summary.cash_sales;
      document.getElementById('kpiUpiSales').innerText = '₹' + summary.upi_sales;
      document.getElementById('kpiDueSales').innerText = '₹' + summary.due_sales;
      document.getElementById('kpiTotalExpense').innerText = '₹' + summary.total_expense;
      document.getElementById('kpiCashExpense').innerText = `Cash Out: ₹${summary.cash_expense}`;
      document.getElementById('kpiNetCash').innerText = '₹' + summary.net_cash_in_hand;
    }

    function renderTopItems(items) {
      const tbody = document.getElementById('topItemsBody');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center py-6 text-gray-400">No item sales in selected range</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(i => `
        <tr class="hover:bg-gray-50">
          <td class="py-2.5 font-bold text-gray-800">${i.name}</td>
          <td class="py-2.5 font-black text-center text-indigo-600 bg-indigo-50/50 rounded-lg">${i.total_qty} sold</td>
          <td class="py-2.5 font-black text-right text-gray-900">₹${i.total_revenue}</td>
        </tr>
      `).join('');
    }

    function renderOrdersLog(orders) {
      document.getElementById('logCountBadge').innerText = `${orders.length} orders (Click any row to open in POS)`;
      const tbody = document.getElementById('ordersLogBody');
      if (!orders.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-gray-400 font-bold">No orders found for this range</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(o => {
        let badge = '';
        if (o.status === 'DUE_PENDING' || o.payment_mode === 'DUE') {
          badge = `<span class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded text-[10px] font-black">📒 DUE (KHATA)</span>`;
        } else if (o.payment_mode && o.payment_mode.includes('CASH')) {
          badge = `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-black">💵 CASH</span>`;
        } else {
          badge = `<span class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-[10px] font-black">📲 ${o.payment_mode || 'UPI'}</span>`;
        }

        return `
          <tr onclick="selectHistoryOrder(${o.id})" class="hover:bg-amber-50/60 cursor-pointer transition" title="Click to load this order into POS">
            <td class="p-3 font-mono font-bold text-gray-900">#${o.id}</td>
            <td class="p-3 text-[11px] text-gray-500">${new Date(o.created_at).toLocaleString('en-IN')}</td>
            <td class="p-3 font-semibold text-gray-700">${o.order_type} ${o.table_no ? '(' + o.table_no + ')' : ''}</td>
            <td class="p-3">${o.customer_name ? `<span class="font-bold text-gray-800">${o.customer_name}</span> <span class="text-gray-400 font-mono text-[10px]">(${o.customer_phone})</span>` : '<span class="text-gray-400">-</span>'}</td>
            <td class="p-3">${badge}</td>
            <td class="p-3 font-semibold text-gray-500">₹${o.discount || 0}</td>
            <td class="p-3 font-semibold text-gray-500">₹${o.gst || 0}</td>
            <td class="p-3 font-black text-right text-gray-900 text-sm">₹${o.total}</td>
          </tr>
        `;
      }).join('');
    }

    // FEATURE: Click history order to open directly in POS screen
    function selectHistoryOrder(orderId) {
      const selectedOrder = currentReport.orders.find(o => o.id === orderId);
      if (!selectedOrder) return;

      // Save order data to localStorage so POS index.html can catch and open it
      localStorage.setItem('POS_EDIT_ORDER', JSON.stringify(selectedOrder));
      window.location.href = '/pos';
    }

    function loadTodayExpenses() {
      fetch('/api/expenses/today').then(res => res.json()).then(rows => {
        const box = document.getElementById('todayExpenseList');
        if (!rows.length) {
          box.innerHTML = '<p class="text-[10px] text-gray-400 italic">No expenses logged today.</p>';
          return;
        }
        box.innerHTML = rows.map(e => `
          <div class="flex justify-between items-center bg-gray-50 p-1.5 rounded-lg text-[11px]">
            <span class="font-bold text-gray-700">${e.title}</span>
            <span class="font-black text-amber-800">₹${e.amount} (${e.payment_mode})</span>
          </div>
        `).join('');
      });
    }

    function saveExpense(e) {
      e.preventDefault();
      const title = document.getElementById('exp_title').value.trim();
      const amount = Number(document.getElementById('exp_amt').value);
      const payment_mode = document.getElementById('exp_mode').value;

      fetch('/api/expenses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, amount, payment_mode })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('exp_title').value = '';
        document.getElementById('exp_amt').value = '';
        loadReportData();
      });
    }

    function exportToCSV() {
      if (!currentReport.orders || !currentReport.orders.length) return alert('No records to export!');
      let csv = 'Order ID,Date Time,Order Type,Table,Customer Name,Phone,Payment Mode,Status,Subtotal,Discount,GST,Total\n';
      currentReport.orders.forEach(o => {
        csv += `"${o.id}","${o.created_at}","${o.order_type}","${o.table_no || ''}","${o.customer_name || ''}","${o.customer_phone || ''}","${o.payment_mode}","${o.status}","${o.subtotal}","${o.discount}","${o.gst}","${o.total}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `POS_Sales_Report_${document.getElementById('filterStartDate').value}_to_${document.getElementById('filterEndDate').value}.csv`);
      a.click();
    }

    function printDailySettlementSlip() {
      fetch('/api/printer/print-daily-summary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          summary: currentReport.summary,
          dateRange: `${document.getElementById('filterStartDate').value} to ${document.getElementById('filterEndDate').value}`
        })
      })
      .then(res => res.json())
      .then(() => alert('Daily Settlement Summary sent to thermal printer silently!'));
    }

    setDatePreset('today');
  </script>
