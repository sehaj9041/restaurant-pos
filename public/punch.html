<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Punch In / Out</title>
  <link rel="manifest" href="/punch-manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center font-sans select-none p-4">
  <div class="w-full max-w-xs text-center text-white">
    <div id="clock" class="text-4xl font-black tabular-nums"></div>
    <div id="date" class="text-xs text-gray-400 mb-5"></div>
    <div id="msg" class="h-16 flex items-center justify-center text-sm font-bold px-2">Apna PIN daalein</div>
    <div id="dots" class="flex justify-center gap-2 mb-4 h-4"></div>
    <div class="grid grid-cols-3 gap-2" id="pad"></div>
  </div>
<script>
  var pin = '', busy = false, resetTimer = null;
  var msg = document.getElementById('msg');
  function tick() {
    var n = new Date();
    document.getElementById('clock').textContent = n.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true });
    document.getElementById('date').textContent = n.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', weekday: 'long', day: 'numeric', month: 'long' });
  }
  tick(); setInterval(tick, 1000);

  function drawDots() { document.getElementById('dots').innerHTML = pin.split('').map(function () { return '<span class="w-3 h-3 rounded-full bg-orange-500"></span>'; }).join(''); }
  function say(text, cls) { msg.className = 'h-16 flex items-center justify-center text-sm font-bold px-2 ' + (cls || ''); msg.textContent = text; }
  function reset(delay) { clearTimeout(resetTimer); resetTimer = setTimeout(function () { pin = ''; drawDots(); say('Apna PIN daalein'); }, delay || 0); }

  function press(k) {
    if (busy) return;
    clearTimeout(resetTimer);
    if (k === 'C') { pin = ''; say('Apna PIN daalein'); }
    else if (k === '⌫') pin = pin.slice(0, -1);
    else if (k === 'OK') return submit();
    else if (pin.length < 6) pin += k;
    drawDots();
  }

  async function submit() {
    if (pin.length < 4) return say('PIN kam se kam 4 digit ka hai', 'text-amber-400');
    busy = true; say('Please wait...', 'text-gray-300');
    try {
      var r = await fetch('/api/attendance/punch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: pin }) });
      var j = await r.json().catch(function () { return {}; });
      if (r.ok) {
        var inn = j.action === 'IN';
        say((inn ? '✅ Punch IN — ' : '👋 Punch OUT — ') + j.name + ' (' + j.time + ')' + (inn ? '' : ' • ' + j.hours + ' ghante'), inn ? 'text-emerald-400' : 'text-sky-400');
      } else say(j.error || 'Error', 'text-red-400');
    } catch (e) { say('Server se connect nahi ho paaya', 'text-red-400'); }
    busy = false; pin = ''; drawDots(); reset(4000);
  }

  document.getElementById('pad').innerHTML = ['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(function (k) {
    return '<button onclick="press(\'' + k + '\')" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 rounded-xl py-4 text-2xl font-black">' + k + '</button>';
  }).join('') + '<button onclick="press(\'OK\')" class="col-span-3 bg-orange-600 hover:bg-orange-700 rounded-xl py-4 text-lg font-black">PUNCH IN / OUT</button>';
  document.addEventListener('keydown', function (e) {
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Enter') press('OK'); else if (e.key === 'Backspace') press('⌫');
  });
</script>
</body>
</html>
